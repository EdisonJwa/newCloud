<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="color-scheme" content="light dark">
  <title>newcloud</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <!-- Three columns with different jobs: navigation, content, and the inspector.
       The shell is almost empty because every view is built by the script from data, so
       nothing here can get out of step with the API and nothing user-controlled is ever
       parsed as HTML. -->
  <div id="app">
    <aside class="rail" id="rail"></aside>
    <main class="content" id="content"></main>
    <aside class="inspector" id="inspector"></aside>
  </div>

  <div id="dropzone">
    <div class="box">
      Drop to upload
      <span class="sub" id="drop-target"></span>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="/assets/app.js" defer></script>
</body>
</html>
