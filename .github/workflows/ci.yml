name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The PostgreSQL conformance suite is the whole point of this job: the in-memory
      # and SQL implementations are supposed to be interchangeable, and the only way
      # to know that is to run the same tests against both. Skipping it is how the
      # "passes in tests, 500s in production" class of bug gets in.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: newcloud
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Must satisfy go.mod, which requires 1.26 for os.Root's write methods.
          # 1.26.10 is the first patch with the crypto/x509 fix for GO-2026-6809;
          # govulncheck fails the build on the stdlib advisory in 1.26.9.
          go-version: "1.26.10"
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: S3-compatible server for the object-store tests
        # moto rather than MinIO: no registry pull to depend on, and these tests need S3
        # semantics, not MinIO's implementation of them.
        #
        # A venv keeps moto's dependencies away from the runner's distro packages: the
        # system pyOpenSSL is old enough that current cryptography removed GEN_EMAIL, and
        # boto3 then fails to import before the server ever starts.
        run: |
          python -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/moto/bin/python" -m pip install --quiet "moto[server]"
          "$RUNNER_TEMP/moto/bin/moto_server" -p 19000 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19000/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          "$RUNNER_TEMP/moto/bin/python" - <<'PY'
          import boto3
          s3 = boto3.client(
              "s3", endpoint_url="http://127.0.0.1:19000", region_name="us-east-1",
              aws_access_key_id="testkey", aws_secret_access_key="testsecret123",
          )
          s3.create_bucket(Bucket="newcloud-test")
          PY
      - name: test (race, with PostgreSQL)
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/newcloud?sslmode=disable
          TEST_S3_ENDPOINT: 127.0.0.1:19000
          TEST_S3_BUCKET: newcloud-test
          TEST_S3_ACCESS_KEY: testkey
          TEST_S3_SECRET_KEY: testsecret123
          TEST_S3_SECURE: "0"
        # The race detector matters here: share download counters and session
        # revocation are the two places where a data race would be silent in
        # production.
        #
        # -p 1 serialises PACKAGES, and that is load-bearing rather than cautious: the
        # PostgreSQL suites share one database and reset the public/audit schemas between
        # runs (resetSchema), so two packages running concurrently drop each other's tables
        # mid-test. That is why a full `go test ./...` with TEST_DATABASE_URL set failed
        # intermittently while each package passed alone. Within a package, `go test`
        # already serialises unless a test asks for parallel execution.
        run: go test -race -count=1 -p 1 ./...

      - name: build
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-X main.version=ci-${GITHUB_SHA::12}" \
            -o /tmp/newcloud ./cmd/newcloud
          # Fails the build if the stamp did not land: a version flag that silently
          # reports "dev" is worse than no flag, because it looks like it worked.
          /tmp/newcloud --version | grep -q "ci-"

      - name: example config parses
        # An example config that fails validation is worse than none: operators copy
        # it verbatim and hit a startup error with no obvious cause.
        run: go test ./internal/config/ -run TestExampleConfig -count=1 -v

  web:
    # The browser client is TypeScript that ships as bytes inside the Go binary, so it is
    # checked like any other build artifact: it must typecheck, it must build, and the
    # generated API types must not drift from openapi.yaml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: typecheck
        working-directory: web
        run: pnpm typecheck
      - name: contrast meets WCAG AA
        # The colour claim is measured, not asserted by eye.
        working-directory: web
        run: pnpm contrast

      - name: every translated key exists, and every used key is translated
        # A typo in t("...") does not fail the compiler: it renders the key itself, so the
        # button says "acl.grant". And a key present in English but missing elsewhere silently
        # falls back, which is how a half-translated screen ships.
        working-directory: web
        run: pnpm i18n
      - name: generated API types are current
        # Regenerating from openapi.yaml and diffing is the only way to know the committed
        # output still describes the spec. A stale client type is worse than none.
        working-directory: web
        run: pnpm gen:api:check
      - name: build
        working-directory: web
        run: pnpm build
      - name: committed bundle matches source
        run: |
          if ! git diff --quiet -- internal/webassets/dist; then
            echo "internal/webassets/dist is stale; run 'make web' and commit the result"
            git diff --stat -- internal/webassets/dist
            exit 1
          fi
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  migration-syntax:
    # The schema is the expensive artifact to get wrong: a bad constraint surfaces
    # months later as corrupted metadata. Apply it against a real PostgreSQL before
    # merging, through the same applier the binary uses.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: newcloud
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: apply migrations through the binary
        env:
          DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/newcloud?sslmode=disable
        run: |
          # The applier strips the psql BEGIN/COMMIT wrapper and runs each file in its
          # own transaction; testing it directly is stricter than piping into psql,
          # because it exercises the dollar-quote handling too.
          go run ./cmd/newcloud migrate
          # Applying twice must be a no-op: that is what makes a redeploy safe.
          go run ./cmd/newcloud migrate
