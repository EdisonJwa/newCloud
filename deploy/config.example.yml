server:
  # The application listener. This origin holds session cookies.
  addr: ":8080"
  # The authenticated application shell. This origin holds session cookies.
  public_url: "https://cloud.example.com"
  # User content lives on a different origin so a stored-XSS payload in an
  # uploaded file cannot reach the session cookie or the app's DOM.
  usercontent_url: "https://usercontent.example.com"
  # The content listener (NC-RR-006). REQUIRED for a real origin boundary.
  #
  # With this set, the application listener does not register the content routes at
  # all and /s/{token}/download and /s/{token}/thumbnail move here with /content/*.
  # The reverse proxy must send only usercontent_url to this port (see Caddyfile)
  # and must refuse content paths on the application vhost — both are configured in
  # deploy/Caddyfile and both are needed.
  #
  # Leave it unset only for a single-origin deployment where a ticket-gated
  # /content/* on the app listener is acceptable; startup then warns that the origin
  # separation depends entirely on the proxy.
  usercontent_addr: ":8081"
  # Peers allowed to set X-Forwarded-For (§9.4). Empty means no peer is trusted and
  # the header is ignored, which is correct unless a reverse proxy is in front.
  # List the proxy's address, not the clients': a client can send any header value.
  # trusted_proxies: ["10.0.0.0/8"]

auth:
  # Pocket ID base URL.
  issuer: "https://id.example.com"
  client_id: "newcloud"
  client_secret_file: "/run/secrets/oidc_client_secret"
  # groups is mandatory: Pocket ID only releases group membership when the
  # scope is requested, and roles are derived from group names.
  scopes: ["openid", "profile", "email", "groups"]
  # jit decides what happens the first time an unknown identity signs in (ID-04).
  #   open    - provision immediately (the historical behaviour, and the default)
  #   pending - create the account disabled; an administrator must approve it
  #   deny    - refuse; accounts must be pre-created
  # allowed_domains narrows who may be provisioned at all, in any mode. It is a second
  # lock, not a replacement for the IdP being the real gate.
  jit:
    mode: "open"
    allowed_domains: []
  group_role_map:
    "cloud-admins": admin
    "cloud-users": user
  session_ttl: "12h"
  # HMAC key for browser session tickets, share-access cookies, and email
  # verification codes. Rotating it invalidates those at once. App Passwords and
  # share links are random values stored only as SHA-256 hashes, so they are not
  # derived from this secret and survive a rotation.
  # Generate with: openssl rand -base64 48
  # At least 32 bytes; the process refuses to start with a short one.
  session_secret: "REPLACE-WITH-32-BYTES-OF-RANDOM"
  # How long a session or App Password may go unconfirmed before it must be
  # renewed by signing in again (ID-06). Roles and groups are read from the IdP
  # only at login, so without this a person removed from a group keeps the old
  # role in an existing session — and forever in a WebDAV App Password, which
  # never talks to the IdP again. 0 disables the check and restores the old
  # "effective at the next login, whenever that is" behaviour (startup warns).
  # 720 = 12 hours, matching session_ttl.
  revalidate_minutes: 720
  # Break-glass stays off unless you explicitly need it. If enabled, allowed_cidrs
  # is mandatory: an unrestricted local admin is an internet-reachable root login.
  allow_local_admin: false
  local_admin:
    username: "breakglass"
    password_argon2_file: "/etc/newcloud/breakglass.pass"
    allowed_cidrs: ["10.0.0.0/8"]

storage:
  # Two independent choices:
  #   backend  where the bytes physically live   (local | s3)
  #   layout   how they are arranged there       (blob | tree)
  #
  # blob: <root>/ab/cd/<sha256>. Directory tree lives only in PostgreSQL.
  #       Deduplicates, versions cost only their differences. Not inspectable
  #       with ls. Best for 40 TiB with many users and repeated content.
  #
  # tree: <root>/<owner>/<path as the user sees it>. Inspectable with ls,
  #       rsync-friendly, but no deduplication and each version is a full copy.
  #
  # This is a deployment decision, not a per-user toggle: switching after data
  # exists requires a migration. See docs/adr/0003-storage-layout.md.
  backend: "local"
  layout: "blob"
  local:
    # blob layout: sharded content store; tmp/ lives under this root so
    #              publishing a blob is a rename(2).
    # tree layout: the user-visible tree itself.
    root: "/var/lib/newcloud/blobs"
  # Where resumable uploads are staged before publishing. Keep this off the content root:
  # with the tree layout the content root is the user-visible tree, and half-written files
  # must never appear there. Defaults to the system temporary directory, which is often a
  # small tmpfs on a real host, so set it explicitly.
  upload_dir: "/var/lib/newcloud/uploads"
  s3:
    # S3-compatible object storage. Tested against AWS S3 semantics; MinIO, Ceph,
    # Cloudflare R2, Backblaze B2 and Wasabi all work through the same client.
    #
    # The bucket must already exist: creating buckets needs account-level
    # permission that a storage server should not have, and a typo in a bucket
    # name should fail at boot rather than silently create a second one.
    endpoint: "minio.example.com"
    bucket: "newcloud"
    region: "us-east-1"
    # Leave the keys empty to use the standard AWS chain (environment,
    # ~/.aws/credentials, instance role). Setting them here is supported for
    # self-hosters who prefer a single config file, but a secret in YAML ends up
    # in backups and in `docker inspect`.
    access_key: ""
    secret_key: ""
    # https. Defaults to true; set false only for a plaintext endpoint on a
    # trusted network.
    secure: true
    # Optional key prefix, for a bucket shared with other applications.
    prefix: ""
    # sse: server-side encryption mode, "" (bucket policy), "sse-s3" or "sse-kms".
    sse: ""
    # Required when sse is sse-kms.
    sse_kms_key_id: ""
    # Read every object back and re-hash it before reporting the upload as
    # successful (INV-03). The pre-upload hash proves the payload matched its
    # address when it left this process; it does not prove what the store now
    # holds, and a retried multipart part can land corrupted at a correct address.
    # Off by default because it doubles the bytes read from the store; turn it on
    # for any deployment that does not fully trust its object store.
    verify_after_put: false
    # Skip the read-back above this many bytes; 0 verifies everything.
    verify_max_bytes: 0
limits:
  max_file_bytes: 1099511627776        # 1 TiB hard cap
  default_file_quota_bytes: 10737418240 # 10 GiB default per-user soft cap
  max_propfind_children: 100000        # protects a single huge directory
  upload_chunk_bytes: 268435456        # 256 MiB chunks
  # Retained-usage caps (§4.3), separate from a user's logical quota. 0 means
  # unlimited, which is the safe default: a deployment that never set one must
  # not discover it by being unable to delete a file.
  max_trash_bytes: 0                   # retained trash per account
  max_pending_upload_bytes: 0          # declared size of unfinished uploads per account
  max_retained_version_bytes: 0        # retained history per account
  # Where image decoding runs (§6.3). "process" (default) decodes in a child
  # process that the deadline can KILL; "inline" decodes in the server process,
  # where a crafted file keeps burning CPU after the timeout because a Go
  # goroutine cannot be cancelled.
  thumbnail_isolation: "process"

  # Integrity scrub: how many blobs to read back and verify against their content
  # address each cycle. 0 disables it.
  #
  # Content addressing makes this check exact — a blob's name IS the SHA-256 of its
  # contents — so a mismatch means storage damaged the data. Nothing else in the system
  # reads stored content back, so without this a corrupted file is found by a user, or by
  # a restore drill months later.
  #
  # The cost is real: each pass reads this many blobs in full. Size it to your store and
  # your tolerance — a few hundred per cycle keeps a multi-terabyte store covered over
  # days, and a small deployment can set it high enough to cover everything.
  blob_scrub_per_pass: 0

  # Data retention. 0 means "keep forever", which is the default and the only safe
  # default: a deployment that has not decided a policy must not silently delete a
  # user's recoverable data.
  #
  # The sweeper runs every 6 hours. When both of these are 0 the server logs a
  # warning at startup, because "retention configured" and "retention does
  # nothing" look identical from outside until the disk fills.
  trash_retention_days: 30             # how long a deleted item stays restorable

  # How old a PARTIAL upload must be before the worker discards it (§9.3 清理未完成 Multipart
  # Upload). Zero disables the sweep.
  #
  # Two things leak without this, and neither is an object:
  #   - S3: an interrupted multipart upload leaves parts that no listing shows. AWS warns these
  #     keep costing money until removed.
  #   - local: Put writes a temp file and renames it into place, so a crash mid-write leaves that
  #     temp file behind.
  #
  # Set this LONGER than the biggest upload you accept. The sweep aborts anything older, so too
  # small a value destroys a transfer that is still running — which is why there is no default.
  upload_cleanup_grace_hours: 24       # discard partial uploads older than this; 0 disables
  version_retention_days: 365          # how long an old version is kept
  version_count_limit: 0               # per-file version count cap; 0 = layout default (10 blob / 3 tree)
  upload_session_ttl_hours: 24         # how long an unfinished resumable upload may sit idle

  # Comments (core-scope §6): how many one account may post in a rolling hour. 0 disables
  # the limit.
  #
  # A rate rather than a total, because the failure is a BURST — a total cap would either be
  # too low for a normal year or too high to stop a spam run. 60 is a comment a minute,
  # which is generous for a human and far below what a script needs.
  comment_rate_per_hour: 60

# Content search (core-scope §7.2, ADR-0016). DISABLED by default, and that is a decision
# rather than an omission: a deployment without an engine still has name-and-filter search,
# and a content query answers `mode: name` with `degraded: true` rather than returning a
# confident empty result. The single binary stays the default; this is what a deployment adds
# when it wants full-text.
search:
  engine: "none"                       # "none" or "elasticsearch"
  # The largest body the indexer reads. A document above it keeps its METADATA in the index,
  # so it stays findable by name, kind, tag and date; its text is simply not searched.
  index_bytes: 10485760                # 10 MiB
  # Which document types have their text extracted. Office formats are deliberately absent:
  # they need an extractor service, and promising them without one is worse than not offering
  # them. A file whose type is not here is still indexed by its metadata.
  content_types:
    - text
    - markdown
    - pdf
  elasticsearch:
    # Tried in order. Plain http is fine to a localhost cluster and logs a warning otherwise,
    # because document text and the credential travel on the wire.
    urls: []
    # urls:
    #   - "http://127.0.0.1:9200"
    username: ""
    password: ""
    # Preferred in a container: a mounted secret never appears in `docker inspect`.
    password_file: ""
    # Namespaces this deployment's index, so two deployments can share one cluster.
    index_prefix: "newcloud"
    timeout_seconds: 5

# Notifications (M4): the in-app inbox and its outbound mail. The in-app half needs no
# configuration; these keys govern when the emitters speak and how long the inbox remembers.
notify:
  # Warn an owner whose storage crosses this percentage of their quota (0 disables).
  quota_warning_percent: 90
  # Remind a share owner this many days before a link expires (0 disables).
  share_expiry_days: 3
  # Prune notifications older than this window, read or not (0 keeps them forever).
  retention_days: 90

# Antivirus (M5): asynchronous scanning through a ClamAV clamd daemon. Disabled by default —
# enabling it is the decision to run a second service beside the binary. A detection
# quarantines: the file moves to the owner's trash, the owner is notified, and the action is
# audited. Never a silent deletion, and never a refusal that waits on a daemon.
antivirus:
  enabled: false
  # clamd TCP address (the loopback default is where a beside-the-binary daemon listens).
  host: "127.0.0.1:3310"
  # Bounds one scan session, both directions.
  timeout_seconds: 30
  # A file larger than this is not scanned; the job says so in the log rather than hanging.
  max_scan_bytes: 104857600            # 100 MiB

# External storage mounts (ADR-0014): SMB/SFTP/FTP/WebDAV remotes as top-level folders,
# browsed in place, never copied. Disabled by default — enabling it is the decision to let
# the file service talk to hosts it did not choose itself.
mounts:
  enabled: false
  # Required when enabled: a hex-encoded 32-byte key encrypting mount credentials at rest.
  # Generate with: openssl rand -hex 32 > /etc/newcloud/mounts.key (mode 0600).
  secret_file: ""
  # When true, any signed-in user may mount into their own tree. Off by default: mount
  # creation points the server at a host of the creator's choosing.
  allow_user_mounts: false
  # Refuse USER-created mounts whose endpoint resolves to loopback/link-local/private
  # space (the SSRF guard). Admin-created mounts are exempt.
  deny_private_addresses: true
  # Per-operation and dial timeout for every mount round trip, seconds.
  timeout_seconds: 30
  # One remote directory listing is fetched whole; refuse above this instead of truncating.
  max_list_entries: 5000
  # Cap for one file written into a mount. 0 means "use limits.max_file_bytes".
  max_file_bytes: 0
  # Schemes a mount may use. SMB has no provider in this build and is refused at creation.
  allowed_schemes: [webdav, ftp, sftp]

audit:
  retention_days: 365
  # anchor_dir publishes a daily checkpoint of the audit chain head (INV-09).
  #
  # A hash chain proves internal consistency, not completeness: someone with database
  # access can delete the newest rows and the remaining chain still verifies. The anchor
  # closes that, so long as it is stored where the application cannot write.
  #
  # Point this at a location with DIFFERENT credentials from the database - a WORM
  # bucket, an append-only volume, a mounted share the app user cannot modify. A
  # directory on the metadata volume makes the anchor decorative.
  # Left empty, anchoring is off and startup logs a warning saying so.
  anchor_dir: ""
  # Ed25519 private key that signs every published checkpoint (§10.2). Generate with:
  #   newcloud audit anchor-keygen --out /etc/newcloud/audit-anchor.key
  #
  # Empty stores checkpoints UNSIGNED, which still detects a truncated chain but not an
  # anchor rewritten by someone with write access to the anchor directory. The private key
  # must live OUTSIDE the anchor directory; give the public half (printed at generation,
  # and at startup when configured) to whoever runs:
  #   newcloud audit verify-anchors --dir <anchor dir> --pubkey <key>
  anchor_signing_key_file: ""
  # Where `newcloud audit prune` writes the events it is about to remove. The prune mark
  # records this path as the answer to "where did that part of the log go", so it should
  # point somewhere the database cannot rewrite — the same kind of location as anchor_dir.
  # Empty means ./audit-archive next to the working directory.
  archive_dir: ""

# Mail delivers share recipient verification codes. It is required for email shares:
# without it the server still accepts the invitation and generates the code, but can only
# log that it could not send it. Leave enabled: false if you only use link and request
# shares.
mail:
  enabled: false
  host: "smtp.example.com"
  port: 587
  username: "newcloud"
  # Prefer password_file in a container: a mounted secret never appears in
  # `docker inspect` or a process listing.
  password_file: "/run/secrets/smtp_password"
  from: "newcloud <no-reply@example.com>"
  # start_tls is what most relays on 587 expect. implicit_tls is for 465.
  start_tls: true
  implicit_tls: false
  # Only for a relay with a self-signed certificate on a private network: it removes the
  # only protection against an active attacker on that path, and the server warns at
  # startup when it is on.
  insecure_skip_verify: false
