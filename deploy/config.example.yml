server:
  # The authenticated application shell. This origin holds session cookies.
  public_url: "https://cloud.example.com"
  # User content lives on a different origin so a stored-XSS payload in an
  # uploaded file cannot reach the session cookie or the app's DOM.
  usercontent_url: "https://usercontent.example.com"

auth:
  # Pocket ID base URL.
  issuer: "https://id.example.com"
  client_id: "newcloud"
  client_secret_file: "/run/secrets/oidc_client_secret"
  # groups is mandatory: Pocket ID only releases group membership when the
  # scope is requested, and roles are derived from group names.
  scopes: ["openid", "profile", "email", "groups"]
  # jit decides what happens the first time an unknown identity signs in (ID-04).
  #   open    - provision immediately (the historical behaviour, and the default)
  #   pending - create the account disabled; an administrator must approve it
  #   deny    - refuse; accounts must be pre-created
  # allowed_domains narrows who may be provisioned at all, in any mode. It is a second
  # lock, not a replacement for the IdP being the real gate.
  jit:
    mode: "open"
    allowed_domains: []
  group_role_map:
    "cloud-admins": admin
    "cloud-users": user
  session_ttl: "12h"
  # HMAC key for browser session tickets, share-access cookies, and email
  # verification codes. Rotating it invalidates those at once. App Passwords and
  # share links are random values stored only as SHA-256 hashes, so they are not
  # derived from this secret and survive a rotation.
  # Generate with: openssl rand -base64 48
  # At least 32 bytes; the process refuses to start with a short one.
  session_secret: "REPLACE-WITH-32-BYTES-OF-RANDOM"
  # Break-glass stays off unless you explicitly need it. If enabled, allowed_cidrs
  # is mandatory: an unrestricted local admin is an internet-reachable root login.
  allow_local_admin: false
  local_admin:
    username: "breakglass"
    password_argon2_file: "/etc/newcloud/breakglass.pass"
    allowed_cidrs: ["10.0.0.0/8"]

storage:
  # Two independent choices:
  #   backend  where the bytes physically live   (local | s3)
  #   layout   how they are arranged there       (blob | tree)
  #
  # blob: <root>/ab/cd/<sha256>. Directory tree lives only in PostgreSQL.
  #       Deduplicates, versions cost only their differences. Not inspectable
  #       with ls. Best for 40 TiB with many users and repeated content.
  #
  # tree: <root>/<owner>/<path as the user sees it>. Inspectable with ls,
  #       rsync-friendly, but no deduplication and each version is a full copy.
  #
  # This is a deployment decision, not a per-user toggle: switching after data
  # exists requires a migration. See docs/adr/0003-storage-layout.md.
  backend: "local"
  layout: "blob"
  local:
    # blob layout: sharded content store; tmp/ lives under this root so
    #              publishing a blob is a rename(2).
    # tree layout: the user-visible tree itself.
    root: "/var/lib/newcloud/blobs"
  # Where resumable uploads are staged before publishing. Keep this off the content root:
  # with the tree layout the content root is the user-visible tree, and half-written files
  # must never appear there. Defaults to the system temporary directory, which is often a
  # small tmpfs on a real host, so set it explicitly.
  upload_dir: "/var/lib/newcloud/uploads"
  s3:
    # S3-compatible object storage. Tested against AWS S3 semantics; MinIO, Ceph,
    # Cloudflare R2, Backblaze B2 and Wasabi all work through the same client.
    #
    # The bucket must already exist: creating buckets needs account-level
    # permission that a storage server should not have, and a typo in a bucket
    # name should fail at boot rather than silently create a second one.
    endpoint: "minio.example.com"
    bucket: "newcloud"
    region: "us-east-1"
    # Leave the keys empty to use the standard AWS chain (environment,
    # ~/.aws/credentials, instance role). Setting them here is supported for
    # self-hosters who prefer a single config file, but a secret in YAML ends up
    # in backups and in `docker inspect`.
    access_key: ""
    secret_key: ""
    # https. Defaults to true; set false only for a plaintext endpoint on a
    # trusted network.
    secure: true
    # Optional key prefix, for a bucket shared with other applications.
    prefix: ""
limits:
  max_file_bytes: 1099511627776        # 1 TiB hard cap
  default_file_quota_bytes: 10737418240 # 10 GiB default per-user soft cap
  max_propfind_children: 100000        # protects a single huge directory
  upload_chunk_bytes: 268435456        # 256 MiB chunks

  # Integrity scrub: how many blobs to read back and verify against their content
  # address each cycle. 0 disables it.
  #
  # Content addressing makes this check exact — a blob's name IS the SHA-256 of its
  # contents — so a mismatch means storage damaged the data. Nothing else in the system
  # reads stored content back, so without this a corrupted file is found by a user, or by
  # a restore drill months later.
  #
  # The cost is real: each pass reads this many blobs in full. Size it to your store and
  # your tolerance — a few hundred per cycle keeps a multi-terabyte store covered over
  # days, and a small deployment can set it high enough to cover everything.
  blob_scrub_per_pass: 0

  # Data retention. 0 means "keep forever", which is the default and the only safe
  # default: a deployment that has not decided a policy must not silently delete a
  # user's recoverable data.
  #
  # The sweeper runs every 6 hours. When both of these are 0 the server logs a
  # warning at startup, because "retention configured" and "retention does
  # nothing" look identical from outside until the disk fills.
  trash_retention_days: 30             # how long a deleted item stays restorable

  # How old a PARTIAL upload must be before the worker discards it (§9.3 清理未完成 Multipart
  # Upload). Zero disables the sweep.
  #
  # Two things leak without this, and neither is an object:
  #   - S3: an interrupted multipart upload leaves parts that no listing shows. AWS warns these
  #     keep costing money until removed.
  #   - local: Put writes a temp file and renames it into place, so a crash mid-write leaves that
  #     temp file behind.
  #
  # Set this LONGER than the biggest upload you accept. The sweep aborts anything older, so too
  # small a value destroys a transfer that is still running — which is why there is no default.
  upload_cleanup_grace_hours: 24       # discard partial uploads older than this; 0 disables
  version_retention_days: 365          # how long an old version is kept
  version_count_limit: 0               # per-file version count cap; 0 = layout default (10 blob / 3 tree)
  upload_session_ttl_hours: 24         # how long an unfinished resumable upload may sit idle

audit:
  retention_days: 365
  # anchor_dir publishes a daily checkpoint of the audit chain head (INV-09).
  #
  # A hash chain proves internal consistency, not completeness: someone with database
  # access can delete the newest rows and the remaining chain still verifies. The anchor
  # closes that, so long as it is stored where the application cannot write.
  #
  # Point this at a location with DIFFERENT credentials from the database - a WORM
  # bucket, an append-only volume, a mounted share the app user cannot modify. A
  # directory on the metadata volume makes the anchor decorative.
  # Left empty, anchoring is off and startup logs a warning saying so.
  anchor_dir: ""

# Mail delivers share recipient verification codes. It is required for email shares:
# without it the server still accepts the invitation and generates the code, but can only
# log that it could not send it. Leave enabled: false if you only use link and request
# shares.
mail:
  enabled: false
  host: "smtp.example.com"
  port: 587
  username: "newcloud"
  # Prefer password_file in a container: a mounted secret never appears in
  # `docker inspect` or a process listing.
  password_file: "/run/secrets/smtp_password"
  from: "newcloud <no-reply@example.com>"
  # start_tls is what most relays on 587 expect. implicit_tls is for 465.
  start_tls: true
  implicit_tls: false
  # Only for a relay with a self-signed certificate on a private network: it removes the
  # only protection against an active attacker on that path, and the server warns at
  # startup when it is on.
  insecure_skip_verify: false
