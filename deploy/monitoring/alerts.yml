# Prometheus alerting rules for newCloud.
#
# Every rule here is derived from a metric this server actually publishes ??see
# internal/metrics/metrics.go for the full list and internal/server/metricsroute_test.go for the
# proof that the route is wired. A rule naming a metric that does not exist is worse than no rule:
# it sits in "pending" forever, looks like coverage on a dashboard, and never fires.
#
# Thresholds are starting points, not truths. Every one of them needs a fortnight of real traffic
# before it is worth trusting, and the comment on each says what would make it tune.
#
# Load with:
#   prometheus --config.file=prometheus.yml   (see prometheus.example.yml)
#   promtool check rules alerts.yml

groups:
  - name: newcloud-availability
    interval: 30s
    rules:
      # The server is up if the scrape succeeds. This is the only rule that should page
      # unconditionally: everything else is a degraded state somebody can look at in the morning.
      - alert: NewCloudDown
        expr: up{job="newcloud"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "newCloud target {{ $labels.instance }} is not answering scrapes"
          description: >-
            The exporter has been unreachable for 2 minutes. Check the process, then the
            database: a server whose database is gone will fail startup and never bind.
          runbook: "deploy/monitoring/runbook.md#newclouddown"

      # 5xx means we broke, not that the caller did. 4xx is deliberately excluded: a burst of
      # 404s is someone probing paths, which is noisy but not an outage.
      - alert: NewCloudErrorRate
        expr: >-
          sum(rate(newcloud_http_requests_total{status_class="5xx"}[5m]))
          /
          clamp_min(sum(rate(newcloud_http_requests_total[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "more than 5% of requests are failing with 5xx"
          description: >-
            Sustained for 10 minutes across {{ $value | humanizePercentage }} of traffic.
            A single 5xx is normal; a sustained fraction is a bug or a dependency.
            If the failures are all on one route, the route is the place to look.
          runbook: "deploy/monitoring/runbook.md#error-rate"

      # The database being down shows up here rather than as a clean "down", because the process
      # stays alive and answers /healthz while every query fails.
      - alert: NewCloudDatabaseDegraded
        expr: >-
          sum(rate(newcloud_http_requests_total{status_class="5xx"}[5m])) > 0.05
          and on()
          up{job="newcloud"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "the server is up but failing requests"
          description: >-
            The process answers scrapes while producing 5xx. That pattern is almost always the
            database: check /readyz, then the connection pool.
          runbook: "deploy/monitoring/runbook.md#database-degraded"

  - name: newcloud-integrity
    interval: 30s
    rules:
      # The audit chain is the product's integrity claim. A head that stops advancing has two
      # causes with opposite responses: nothing is being written (a quiet deployment, fine), or
      # writes are happening and their audit events are not landing (not fine ??that is the
      # fail-closed path in deploy/audit-failure-policy.md behaving as data loss).
      #
      # The rule therefore requires BOTH a stale head and recent write-method traffic. Head age
      # alone fires on every quiet night, which is how an integrity alert becomes noise and then
      # gets silenced. (The gauge itself was a hard-coded 0 until 2026-10-24, so this rule could
      # never fire at all; see docs/reference/review-2026-10-24.md, H6.)
      - alert: NewCloudAuditChainStalled
        expr: |
          newcloud_audit_chain_head_age_seconds > 3600
          and on()
          sum(rate(newcloud_http_requests_total{method=~"POST|PUT|PATCH|DELETE"}[1h])) > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "writes are reaching the server but no audit event has been written for an hour"
          description: >-
            The newest event in the hash chain is {{ $value | humanizeDuration }} old while the
            server is still answering POST/PUT/PATCH/DELETE. Every audited write fails closed, so
            either those requests are all being refused (check the 5xx rate) or events are being
            written somewhere the chain does not see. Check the logs for "audit", then run
            `newcloud audit verify`.
          runbook: "deploy/monitoring/runbook.md#audit-stalled"

      - alert: NewCloudAuditVerificationFailed
        expr: increase(newcloud_audit_anchor_verify_total{result="failed"}[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "the audit anchor verification failed"
          description: >-
            A periodic check found the audit chain does not match its anchor. This is the signal
            the whole audit design exists to produce. Do not restart anything: capture the
            evidence first, then follow the runbook.
          runbook: "deploy/monitoring/runbook.md#audit-verify-failed"

      # GC errors mean blobs were supposed to be removed and were not. Disk fills up quietly.
      - alert: NewCloudBlobGCErrors
        expr: increase(newcloud_blob_gc_errors_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "blob garbage collection reported errors"
          description: >-
            {{ $value }} failures in the last hour. Reclaimed space will be lower than expected;
            check the storage backend and permissions before assuming the metrics are wrong.
          runbook: "deploy/monitoring/runbook.md#blob-gc"

  - name: newcloud-backlog
    interval: 30s
    rules:
      # A failed job is not retried forever: it sits in the failed state until someone looks.
      - alert: NewCloudJobsFailing
        expr: newcloud_jobs{state="failed"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} background jobs are in the failed state"
          description: >-
            Failed jobs are terminal; they do not retry. Whatever they were doing is not happening.
            The queue is inspectable in the database, and the drill covers it, so the cause is
            recoverable ??but nothing will change on its own.
          runbook: "deploy/monitoring/runbook.md#jobs"

      - alert: NewCloudJobBacklogGrowing
        expr: newcloud_jobs{state="pending"} > 1000
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "background queue is backing up ({{ $value }} pending)"
          description: >-
            The drain rate is not keeping up with arrival. Either the worker is not running, or one
            class of job became slow. Note that this is a count, not a rate: a backlog that is
            large but shrinking is fine, which is why the alert waits 30 minutes.
          runbook: "deploy/monitoring/runbook.md#jobs"

      - alert: NewCloudUploadsFailing
        expr: >-
          sum(rate(newcloud_uploads_total{result!="ok"}[10m]))
          /
          clamp_min(sum(rate(newcloud_uploads_total[10m])), 0.001)
          > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "more than 20% of uploads are failing"
          description: >-
            Upload failure usually means storage rather than the client: a full disk, an
            unreachable S3 endpoint, or a quota being hit. Check
            newcloud_blob_gc_errors_total alongside this before blaming the network.
          runbook: "deploy/monitoring/runbook.md#uploads"

  - name: newcloud-clients
    interval: 30s
    rules:
      # A high conflict rate is not an error, but it is a signal: either a client is polling
      # badly, or multiple clients are editing the same tree.
      - alert: NewCloudDAVConflictsHigh
        expr: >-
          sum(rate(newcloud_dav_conflicts_total[15m]))
          /
          clamp_min(sum(rate(newcloud_dav_requests_total[15m])), 0.001)
          > 0.1
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "over 10% of WebDAV requests are conflicting"
          description: >-
            Locks and stale etags, not failures. Worth knowing because the usual cause is one
            badly-behaved client, and the fix is at that client rather than here.
          runbook: "deploy/monitoring/runbook.md#dav-conflicts"
  - name: newcloud-security
    interval: 30s
    rules:
      # Â§3.3 requires "ä½¿ç”¨?Žå‘Šè­? ??an alert when the local administrator is used.
      #
      # This is the one rule here that should reach a human quickly: break-glass exists for
      # IdP-down recovery, and legitimate use is rare and planned. Use that nobody announced is
      # the thing this alert is for, so it fires on the first event rather than on a rate.
      - alert: NewCloudBreakglassUsed
        expr: increase(newcloud_auth_events_total{kind="breakglass_ok"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "the break-glass local administrator was used"
          description: >-
            A local administrator signed in at {{ $labels.instance }}. This bypasses the IdP
            entirely, so it is either a planned recovery or somebody using a credential that
            should not be in play. Confirm who, then confirm why. The audit log has the source
            address and user agent for this event (action auth.breakglass.used).
          runbook: "deploy/monitoring/runbook.md#breakglass"

      # Failures are not page-worthy on their own ??a wrong password happens ??but a burst is
      # someone working through guesses against the one account that does not need the IdP.
      - alert: NewCloudBreakglassAttemptsFailing
        expr: increase(newcloud_auth_events_total{kind="breakglass_denied"}[15m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "repeated failed break-glass attempts ({{ $value }} in 15m)"
          description: >-
            Someone is trying the local administrator repeatedly. Check whether the credential
            needs rotating, and whether the allowed source network is as tight as intended ??            auth.breakglass.denied rows carry the reason (network_denied, bad_password,
            unknown_user).
          runbook: "deploy/monitoring/runbook.md#breakglass"
  - name: newcloud-wal
    interval: 30s
    rules:
      # The disaster-recovery guarantee failing quietly.
      #
      # When archive_command fails, PostgreSQL keeps serving and keeps accepting writes. The
      # deployment looks healthy while the RPO silently degrades from minutes to "whatever is
      # still on that disk". Measured in round 42: pg_wal grew 49 -> 65 -> 81 MB across three
      # rounds of writes with zero segments archived.
      - alert: NewCloudWALArchiveFailing
        expr: increase(newcloud_wal_archive_failed_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "WAL archiving is failing ??the point-in-time recovery guarantee has stopped"
          description: >-
            {{ $value }} archive attempts failed in the last 15 minutes. The database is still
            serving, which is what makes this dangerous: writes continue while the recovery point
            slides backward. Check that the archive destination is mounted and writable, then
            check free space on it. Nothing recovers automatically.
          runbook: "deploy/monitoring/runbook.md#wal"

      # Pending segments is the gauge that predicts an outage rather than describing one. Each
      # segment is 16 MB by default, so this is also a disk-space countdown.
      - alert: NewCloudWALBacklogGrowing
        expr: newcloud_wal_segments_pending > 64
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} WAL segments are waiting to be archived"
          description: >-
            Unarchived segments accumulate in pg_wal and cannot be recycled until they are
            archived. At the default 16 MB per segment this is over a gigabyte of growth that will
            not stop. When the disk fills, PostgreSQL stops accepting writes ??and the cause will
            be an archive command that has been failing for hours.
          runbook: "deploy/monitoring/runbook.md#wal"

      # archived_count is a counter that should keep rising on any deployment with archiving on.
      # Flat means the archiver is not running at all ??a different fault from a failing command.
      - alert: NewCloudWALArchiveStalled
        expr: >-
          increase(newcloud_wal_archived_total[1h]) == 0
          and newcloud_wal_segments_pending > 8
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "no WAL segment has been archived for an hour while segments are pending"
          description: >-
            Either archive_mode is off (in which case there is no point-in-time recovery at all
            and the RPO is the dump interval), or the archiver is wedged. Check
            `SHOW archive_mode` before anything else.
          runbook: "deploy/monitoring/runbook.md#wal"
  - name: newcloud-integrity-scrub
    interval: 30s
    rules:
      # The blob scrub is the only thing that reads live content back. Content addressing makes
      # the check exact: the file name is the hash of its bytes, so a mismatch is corruption with
      # no interpretation needed.
      - alert: NewCloudBlobCorrupted
        expr: newcloud_blob_scrub_corrupt > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} blob(s) on disk do not match their content address"
          description: >-
            Storage has damaged data, or a transfer wrote the wrong bytes. The blobs are named in
            the log with both hashes. Restore them from a backup; do not delete them, because the
            metadata still references them and a delete would turn corruption into data loss.
          runbook: "deploy/monitoring/runbook.md#blob-corruption"

      - alert: NewCloudBlobMissing
        expr: newcloud_blob_scrub_missing > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} blob(s) are referenced by metadata but absent from storage"
          description: >-
            Different from corruption: something deleted content that the database still points
            at. Check whether a restore was interrupted, or whether a collector ran against a
            database it did not belong to. Restoring the blob is safe; deleting the row loses the
            file.
          runbook: "deploy/monitoring/runbook.md#blob-corruption"

      # A scrub that never runs looks identical to one that finds nothing. Without this, disabling
      # the scrub silently removes the only integrity signal in the system.
      - alert: NewCloudBlobScrubNotRunning
        expr: newcloud_blob_scrub_checked == 0 and newcloud_audit_events > 0
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "the blob integrity scrub has not verified anything for 6 hours"
          description: >-
            Either the scrub is disabled (it needs an explicit limit and the content store), or it
            is failing. Both mean nothing is checking that stored bytes still match their
            addresses ??which is the one thing that catches silent corruption before a user does.
          runbook: "deploy/monitoring/runbook.md#blob-corruption"

      # The backup is the one thing whose failure is invisible until it is needed. backup-all.sh
      # writes a textfile-collector metric (deploy/backup/README note) so this rule can see it;
      # without the file the series is absent and the rule stays silent rather than firing on
      # every deployment that has not opted in.
      - alert: NewCloudBackupStale
        expr: time() - newcloud_backup_last_success_timestamp_seconds > 36 * 3600
        labels:
          severity: critical
        annotations:
          summary: "no successful backup has been recorded for over 36 hours"
          description: >-
            The nightly backup has not reported success. A backup that fails quietly is worse than
            one that was never configured, because the restore plan assumes it exists. Check the
            cron output and run deploy/backup/restore-drill.md before the next change window.
          runbook: "deploy/backup/restore-drill.md"

      - alert: NewCloudBackupRestoreUnproven
        expr: time() - newcloud_backup_last_drill_timestamp_seconds > 100 * 24 * 3600
        labels:
          severity: warning
        annotations:
          summary: "the restore drill has not been run in over 100 days"
          description: >-
            The drill is what turns a backup into evidence (INV-08). A quarterly cadence is what
            restore-drill.md asks for; this fires when one has been skipped by more than a week.
          runbook: "deploy/backup/restore-drill.md"
  # A file whose metadata exists and whose bytes the storage backend could not produce. This should
  # be zero forever: a single occurrence means somebody's file is broken and can only be recovered
  # from a backup, so it pages on the first one rather than on a rate.
  - alert: NewCloudContentMissing
    expr: increase(newcloud_content_missing_total[15m]) > 0
    labels:
      severity: critical
    annotations:
      summary: "a file's content is missing on the storage backend"
      description: |
        The metadata row exists and the caller was allowed to read it, but the storage layer could
        not produce the bytes. This is not a missing file ??it is damage, and 404 vs 500 is the
        difference the failure table insists on. Check the storage backend for the files named in
        the server log ("content missing for"), then restore them from a backup.
      runbook: "deploy/monitoring/runbook.md#content-missing"

  # ---------------------------------------------------------------- search index --
  #
  # Content search is an OPTIONAL convenience (core-scope ¡×7.2, ADR-0016), so these two do not page.
  # That is a deliberate severity choice rather than an oversight: a lagging index means a search
  # returns fewer results, and naming-and-filter search keeps working the whole time. A deployment
  # with no engine configured never fires either rule, because both series stay at zero ? which is
  # the honest value ("there is no index to be behind") rather than a missing series.
  #
  # The lag is measured from the QUEUE, not from the engine. The engine can only say that it
  # answered; the queue says how long the oldest unprocessed change has been waiting, which is the
  # number that grows during an outage.
  - alert: NewCloudSearchIndexLagging
    expr: newcloud_search_index_lag_seconds > 900
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "the content index is more than 15 minutes behind"
      description: |
        The oldest pending search.index job has been waiting more than fifteen minutes, so a
        content search is answering from a stale cache. Search still works ? it just may not find a
        document stored in the last quarter hour. Check that the worker is running and that the
        engine is reachable at search.elasticsearch.urls; newcloud_search_index_errors_total says
        whether writes are failing. The backfill duty catches up on its own once the engine is back,
        so no manual re-index is needed.
      runbook: "deploy/monitoring/runbook.md#search-index"

  - alert: NewCloudSearchIndexErrors
    expr: increase(newcloud_search_index_errors_total[15m]) > 5
    labels:
      severity: warning
    annotations:
      summary: "writing to the content index is failing"
      description: |
        More than five index writes or reads failed in fifteen minutes. Either the engine is
        unreachable or it is rejecting documents (a mapping conflict answers 400 and stops retrying,
        so it does not inflate this counter indefinitely). Content search is degraded, not broken:
        name-and-filter search is unaffected and no write fails because of it. Check the engine's
        own health and the server log for "content search degraded".
      runbook: "deploy/monitoring/runbook.md#search-index"