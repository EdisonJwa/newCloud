# newCloud — single-host deployment.
#
# Two decisions in this file are not stylistic:
#
#   * /var/lib/newcloud is mounted as ONE bind mount. blobs/ and blobs/tmp/ must
#     share a filesystem or publishing a blob degrades from rename(2) to copying
#     the whole file. At 40 TiB that is not a slowdown, it is an outage.
#   * postgres data and blobs are separated into different mount points so a
#     restic snapshot of blobs does not fight the database for IO. Put them on
#     different physical disks in production.

name: newcloud

# Two database passwords are required:
#
#   PG_PASSWORD      the owner (newcloud), used by migrations and by this postgres service
#   PG_APP_PASSWORD  the application role (newcloud_app), used to serve requests
#
# They must differ. The point of the split is that the request-serving connection cannot
# rewrite the audit log; sharing one password gives that up.
#
# Bootstrap the application role password once, after the first migration:
#
#   docker compose exec postgres psql -U newcloud -d newcloud \
#     -c "ALTER ROLE newcloud_app PASSWORD '...'"
#
# The migration that creates newcloud_app leaves it without a password on purpose: a
# password in a migration file would be in version control forever and shared by every
# environment.

services:
  web:
    image: newcloud:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      NEWCLOUD_CONFIG: /etc/newcloud/config.yml
      # The application connects as newcloud_app, NOT as the owner.
      #
      # newcloud_app has SELECT/INSERT/UPDATE/DELETE on the public tables but only
      # SELECT/INSERT on the audit log, so the append-only guarantee is enforced by the
      # database rather than by convention. It is a non-superuser: a superuser bypasses
      # every GRANT, which made the restriction decorative while the app connected as the
      # owner.
      #
      # Migrations still need the owner. Run them with DATABASE_URL pointing at the
      # superuser - see docs/guides/deployment.md.
      DATABASE_URL: postgres://newcloud_app:${PG_APP_PASSWORD}@postgres:5432/newcloud?sslmode=disable
      PGHOST: postgres
      PGUSER: newcloud_app
      PGPASSWORD: ${PG_APP_PASSWORD}
      PGDATABASE: newcloud
    volumes:
      - /etc/newcloud:/etc/newcloud:ro
      - /var/lib/newcloud:/var/lib/newcloud
    ports:
      # The application listener on the loopback interface. Session cookies live on
      # this origin, so it must never be reachable except through the proxy.
      - "127.0.0.1:8080:8080"
      # The content listener (NC-RR-006). It serves only /content/*, /s/{token}/download
      # and /s/{token}/thumbnail, and answers 404 to everything else, so exposing it is
      # far narrower than exposing the application. It is bound to loopback for the same
      # reason as above: Caddy is the only thing that should reach either port.
      #
      # server.usercontent_addr must be ":8081" for this to have anything to talk to;
      # without it the content routes stay on the application listener and startup warns.
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/newcloud", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:17
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      # Archive to a path that is NOT on the same disk as the data directory.
      - -c
      - archive_command=test ! -f /archive/%f && cp %p /archive/%f
      # archive_timeout is what makes the RPO claim true, and it was missing.
      #
      # PostgreSQL archives a WAL segment when it fills (16 MB) or when archive_timeout fires,
      # whichever comes first. Without this setting a quiet deployment can hold an unarchived
      # segment for hours — so "RPO <= 15 minutes" was only true on a busy system, and the 15
      # minutes is exactly what a quiet Sunday night needs.
      #
      # 5 minutes, not 15: the stated RPO is the total, and archiving is one of its terms. A
      # 15-minute timeout plus transfer time would exceed the promise rather than meet it.
      - -c
      - archive_timeout=5min
      - -c
      - max_connections=100
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
    environment:
      POSTGRES_DB: newcloud
      POSTGRES_USER: newcloud
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - /var/lib/newcloud-pg:/var/lib/postgresql/data
      - /mnt/wal-archive:/archive        # separate disk, ideally off-host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newcloud -d newcloud"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
