openapi: 3.1.0
info:
  title: newCloud
  version: "1"
  description: |
    The REST surface the browser client uses.

    This document is the single source of truth for the client's types: `src/api-types.ts` is
    generated from it and `src/types.ts` only aliases the generated names. Hand-writing the
    types beside a hand-written client is how a client drifts from its server without anyone
    noticing — the compiler keeps agreeing with the wrong shape.

    Denials are reported as 404, never 403: the server does not reveal whether an object
    exists to a caller who may not see it. Clients must not special-case 403.

servers:
  - url: ""

paths:
  /api/auth/me:
    get:
      summary: The signed-in user
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/auth/logout:
    post:
      summary: End the session
      responses:
        "204": { description: ended }

  /api/files/:
    get:
      summary: List one directory
      description: |
        Pages are addressed by a cursor, not an offset. An offset over a name sort
        returns duplicates and drops rows whenever a sibling is created or deleted
        between requests; the cursor is the last name of the previous page, so the
        next page starts strictly after it and stays correct under concurrent edits.
      parameters:
        - name: path
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          description: The `cursor` from the previous page. Omit for the first page.
          schema: { type: string }
        - name: limit
          in: query
          description: Page size, clamped by the server's configured maximum.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "404": { $ref: "#/components/responses/NotFoundResult" }
    delete:
      summary: Move a file or directory to the trash
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "204": { description: trashed }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/files/uploads:
    post:
      summary: Start a resumable upload (DEPRECATED)
      deprecated: true
      description: |
        DEPRECATED — use the tus endpoints at `/api/files/tus`. Responses carry `Deprecation`,
        `Sunset` and a `Link: rel="successor-version"` header; the endpoints stay for one release
        (core-scope §1) and are then removed.

        Returns a session id, the contiguous offset the server has acknowledged, and the full set
        of acknowledged ranges. Chunks are sent with Content-Range and may be sent in any order,
        including several at once. A chunk that overlaps bytes the server already holds is refused
        with 409 and the acknowledged set, so a retrying client knows exactly what is missing.

        Sessions are durable: the staging bytes and a metadata record survive a dropped connection,
        a crash, and a graceful restart. They expire after the configured session TTL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, name, size]
              properties:
                path: { type: string, description: Target directory, empty for the root }
                name: { type: string }
                size: { type: integer, minimum: 0 }
      responses:
        "201":
          description: session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSession" }
        "413": { description: the declared size exceeds the configured limit }
        "429": { description: too many unfinished uploads for this account }

  /api/files/uploads/{id}:
    get:
      summary: Read an upload's acknowledged ranges
      description: |
        The authoritative resume state. `offset` is the contiguous prefix; `ranges` lists every
        acknowledged interval, including ranges beyond a hole, which is what a parallel client
        needs in order to send only what is missing.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: the session's progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSession" }
        "404": { $ref: "#/components/responses/NotFoundResult" }
    put:
      summary: Append one chunk
      description: |
        The chunk may start anywhere inside the declared size, so chunks may be sent in parallel
        or out of order. It must not overlap bytes already acknowledged (or another chunk currently
        being written); that refusal is 409 with the acknowledged ranges.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: Content-Range
          in: header
          required: true
          description: 'bytes <start>-<end>/<total>'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: chunk accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadProgress" }
        "409":
          description: the chunk overlaps bytes the server already has
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadConflict" }
    delete:
      summary: Abort an upload and discard its staged bytes
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: discarded }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/files/uploads/{id}/complete:
    post:
      summary: Publish a completed upload
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: the file now exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileNode" }
        "409":
          description: the upload is not complete yet; offset and ranges say what the server has
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadConflict" }

  /api/files/tus/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    head:
      summary: Report the server's offset for a tus upload
      description: |
        Returns `Upload-Offset`, `Upload-Length` (omitted while the length is deferred) and
        `Upload-Expires`. A session the caller does not own is indistinguishable from one that does
        not exist: 404 either way.
      responses:
        "200":
          description: ok
          headers:
            Upload-Offset: { schema: { type: integer } }
            Upload-Length: { schema: { type: integer } }
            Upload-Expires: { schema: { type: string } }
        "404": { $ref: "#/components/responses/NotFoundResult" }
    patch:
      summary: Append a chunk at an offset
      description: |
        `Upload-Offset` must equal the server's current offset. A stale one is 409 and CHANGES
        NOTHING — the response carries the true offset, which is what lets a client resume.
        `Upload-Checksum: sha256 <base64>` verifies the chunk; a mismatch is 460 and the chunk is
        not acknowledged, so the retry sends the same range.
      responses:
        "204":
          description: appended
          headers:
            Upload-Offset: { schema: { type: integer } }
        "409":
          description: The offset does not match; Upload-Offset carries the server's true position.
        "460":
          description: The chunk does not match Upload-Checksum. Not acknowledged.
        "404": { $ref: "#/components/responses/NotFoundResult" }
    delete:
      summary: Terminate a tus upload
      responses:
        "204": { description: discarded }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/files/recent:
    get:
      summary: Recently modified files, newest first
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 60, default: 12 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FileNode" } }

  /api/files/search:
    get:
      summary: Search across the tree, with filters
      description: |
        Name matching plus the filter, sort and cursor vocabulary of core-scope §7.1.

        An empty `q` with at least one filter is a LISTING, not an error — that is what the file
        manager's filter bar produces when the search box is cleared. An empty `q` with no filter
        still returns nothing, because a box that dumps the library while you type is noise.

        `mode` selects what is searched:
          - `name` (default) matches filenames only and needs no engine;
          - `content` looks inside document bodies and needs `search.engine: elasticsearch`;
          - `all` is the union of the two.

        When a content mode is requested and no engine is configured, the response comes back with
        `mode: name` and `degraded: true`. That is deliberate (ADR-0016): a search that silently
        looked in fewer places than asked would let a user conclude a document does not exist.
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: kind
          in: query
          description: Restrict to files or directories.
          schema: { type: string, enum: [file, dir] }
        - name: mime
          in: query
          description: Content-type PREFIX, e.g. "image/" or "text/".
          schema: { type: string }
        - name: size_min
          in: query
          schema: { type: integer, minimum: 0 }
        - name: size_max
          in: query
          schema: { type: integer, minimum: 0 }
        - name: modified_after
          in: query
          description: RFC 3339 timestamp or a YYYY-MM-DD date (midnight UTC).
          schema: { type: string }
        - name: modified_before
          in: query
          schema: { type: string }
        - name: tag
          in: query
          description: A tag id; restricts to nodes carrying it.
          schema: { type: string, format: uuid }
        - name: favorite
          in: query
          description: "1/true restricts to the caller's starred nodes."
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [modified, name, size], default: modified }
        - name: mode
          in: query
          schema: { type: string, enum: [name, content, all], default: name }
        - name: cursor
          in: query
          description: |
            The `cursor` from the previous page. It is bound to the sort it was issued for: a
            cursor from a name sort used against a size sort is refused with 400, because page 2
            of one ordering means nothing in another.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }
        "400":
          description: |
            An invalid cursor, or a filter combination that cannot mean anything (e.g. kind=dir
            with a mime prefix). Answered rather than returning an empty set, because "no matches"
            for an impossible question sends the user looking for the wrong problem.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/files/trash:
    get:
      summary: Trashed nodes
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FileNode" } }
                  truncated: { type: boolean }
                  cursor: { type: string }
                  retention_days: { type: integer }

  /api/files/trash/empty:
    post:
      summary: Permanently delete the caller's own trash
      description: |
        Core-scope §3. Runs the same purge routine the retention sweep runs, scoped to the caller
        and ignoring the retention window — the user has decided, so the window that protects them
        from an accident is exactly what they are overriding.

        Bounded and idempotent: `more` means the bin may still hold items and the call should be
        repeated. A timeout therefore means "call me again", never "unknown state".
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmptyTrashResult" }

  /api/files/favorite:
    put:
      summary: Star a node for the caller
      description: |
        Idempotent: starring twice is one row and no error, so a client that retries after a
        dropped response does not have to ask "is it starred now?".

        Addressed by `id` or `path`. The id form exists because a file in somebody else's namespace
        has no path the caller can spell — that is what a grant is for — so starring a shared file
        would otherwise be impossible.
      parameters:
        - name: id
          in: query
          schema: { type: string, format: uuid }
        - name: path
          in: query
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteToggle" }
        "404": { $ref: "#/components/responses/NotFoundResult" }
    delete:
      summary: Un-star a node for the caller
      description: Idempotent, like the PUT.
      parameters:
        - name: id
          in: query
          schema: { type: string, format: uuid }
        - name: path
          in: query
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteToggle" }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/favorites:
    get:
      summary: The caller's starred nodes, newest first
      description: |
        Each row's grant is re-checked as it is rendered, so revoking access removes the node from
        the list rather than leaking that it exists under the old grant. Favorites on trashed nodes
        are hidden, not deleted: restoring the node brings the star back.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FileNode" } }
                  truncated: { type: boolean }
                  cursor: { type: string }

  /api/tags/:
    get:
      summary: Tags visible to the caller
      description: |
        The deployment's system tags plus the caller's own. `count` is how many nodes the CALLER can
        see carry the tag — a count over every node would leak the existence of files they have no
        access to.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Tag" } }
    post:
      summary: Define a tag
      description: |
        A personal tag is created by any signed-in account. `system: true` creates the deployment's
        shared vocabulary and is an administrator action; a non-admin asking for one is refused
        rather than silently given a personal tag, because the two are different objects.

        Names are unique case-insensitively within their scope (§5). Colours come from a fixed
        palette, because the value ends up in a CSS class.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTagRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "403":
          description: A non-admin asked for a system tag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A tag with that name already exists, ignoring case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The name or colour is invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/tags/{id}:
    patch:
      summary: Rename or recolour a tag
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                color: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "404": { $ref: "#/components/responses/NotFoundResult" }
    delete:
      summary: Delete a tag and every assignment of it
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: deleted }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/nodes/{id}/tags:
    post:
      summary: Apply a tag to a node
      description: |
        Assignment is a METADATA WRITE, so it requires `write` on the node (§5). Reading tags only
        requires `read`, which the listing enforces by only annotating rows the caller can see.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag_id]
              properties:
                tag_id: { type: string, format: uuid }
      responses:
        "200":
          description: The node's resulting tag set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeTags" }
        "404": { $ref: "#/components/responses/NotFoundResult" }
        "409":
          description: The node already carries the maximum number of tags.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Remove a tag from a node
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag_id]
              properties:
                tag_id: { type: string, format: uuid }
      responses:
        "200":
          description: The node's resulting tag set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeTags" }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/nodes/{id}/comments:
    get:
      summary: A node's discussion, oldest first
      description: |
        Reading a thread requires `read` on the node, checked with the same call `/api/nodes/{id}`
        uses — so a node the caller cannot read is indistinguishable from one that does not exist.

        Deleted comments come back as tombstones with an EMPTY body: the row stays so the replies
        keep their place, but the text it is hiding is not handed to the client.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          description: The `cursor` from the previous page (a posting-order sequence).
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentThread" }
        "404": { $ref: "#/components/responses/NotFoundResult" }
    post:
      summary: Post a comment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCommentRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "404":
          description: No such node, or the caller cannot read it — including a parent_id that is not a live top-level comment on this node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The body is empty, over 2 000 characters, or carries control characters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: The caller's hourly comment allowance is used up (code comment_rate_limited).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/comments/{id}:
    patch:
      summary: Edit the caller's own comment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "404": { $ref: "#/components/responses/NotFoundResult" }
        "422":
          description: The body is invalid, or the comment is already deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Soft-delete a comment
      description: |
        Three parties may do it: the author, an administrator, or a holder of `manage_permissions`
        on the node. Deleting somebody ELSE's comment is a moderation action and is hash-chained
        (`comment.moderate`, core-scope §8); deleting your own is not.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id: { type: string }
                  deleted: { type: boolean }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/files/tus:
    options:
      summary: tus capability probe
      description: |
        Core-scope §1. Requires a session like every other verb: tus does not demand otherwise, and
        answering anonymously would disclose `limits.max_file_bytes` through `Tus-Max-Size`. The
        answer names the protocol version, the extensions this build implements and the largest file
        it accepts — a client that sees an extension here may rely on it.
      responses:
        "204":
          description: ok
          headers:
            Tus-Version: { schema: { type: string } }
            Tus-Extension: { schema: { type: string } }
            Tus-Max-Size: { schema: { type: integer } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      summary: Create a tus upload (creation, creation-with-upload, creation-defer-length, final concat)
      description: |
        The wire protocol is tus 1.0.0; the durability machinery is the same session manager the
        deprecated `/api/files/uploads` endpoints use. The refusals happen before a byte is
        accepted — destination authorization, the folded-name conflict check and the quota — and
        finalization re-runs every guard inside the statement that changes the row.

        `Upload-Metadata` carries `filename` and `destination`, base64-encoded per the spec.
      responses:
        "201":
          description: created
          headers:
            Location: { schema: { type: string } }
            Tus-Resumable: { schema: { type: string } }
        "400":
          description: Bad metadata, a missing filename or an unusable name.
        "413":
          description: The declared length exceeds limits.max_file_bytes.

  /api/files/versions:
    get:
      summary: Stored versions of one file
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionsResponse" }

  /api/files/restore-version:
    post:
      summary: Make an older version current
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, version]
              properties:
                path: { type: string }
                version: { type: integer }
      responses:
        # The handler returns the restored node so a client can use the response to update the row it
        # is showing. It used to be documented as 204 No Content, which is not what the server sends
        # (fourth independent review, 2026-10-23, item 6.2).
        "200":
          description: The restored node
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileNode" }
        # The tree layout keeps bytes at the path and overwrites them, so a superseded version's
        # content is not retained; restoring one would report a change it cannot make.
        "409":
          description: This layout keeps no restorable version content (code no_version_content).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/files/restore:
    post:
      summary: Restore from the trash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
      responses:
        "204": { description: restored }

  /api/files/mkdir:
    post:
      summary: Create a directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
      responses:
        "201": { description: created }

  /api/files/rename:
    post:
      summary: Rename in place
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, name]
              properties:
                path: { type: string }
                name: { type: string }
      responses:
        "204": { description: renamed }

  /api/files/move:
    post:
      summary: Rename and/or reparent one node
      description: |
        The single-item primitive: a move is a rename plus a reparent, and the two ends are checked
        independently — `delete`-class authority on the source, `create`/`overwrite` on the
        destination.

        The file manager routes every transfer, single or multiple, through `/api/files/batch` so
        that one code path covers both. This route stays because it is the shape scripts and the
        existing tests use, and because a single operation deserves an unambiguous endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveRequest" }
      responses:
        "200":
          description: the moved node
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileNode" }
        "404": { $ref: "#/components/responses/NotFoundResult" }
        "409": { description: something with that name already exists at the destination }

  /api/files/batch:
    post:
      summary: Copy or move one or many nodes
      description: |
        One request for a multi-file selection, because partial failure has to be reportable: the
        answer is a list with one result per item, in the order they were sent.

        With a SINGLE item, a failure answers that item's own status (409 `target_exists`, 404
        `not_found`, …) exactly like the dedicated routes. With two or more the response is 200 and
        the caller inspects `results`, because "three moved, two did not" is the ordinary case and
        no single status code can describe it.

        `overwrite` defaults to false and answers 409 `target_exists` rather than replacing:
        "replace it?" is a question, and an overwrite nobody confirmed is a deletion. A retry with
        `overwrite: true` replaces, sending the previous node to the trash.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchRequest" }
      responses:
        "200":
          description: per-item outcomes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchResponse" }
        "400": { description: invalid op, empty selection, or too many items }
        "404": { $ref: "#/components/responses/NotFoundResult" }
        "409": { description: a single-item request whose destination already exists }

  /api/files/zip:
    get:
      summary: Download a ZIP of the selection
      description: |
        Streams the archive as it is produced — nothing is staged to a temporary file and nothing is
        assembled in memory, so a download the client abandons stops costing work immediately.

        Every node is authorized BEFORE the first byte is written. Once the archive headers are on
        the wire there is no way to answer 404, and a refusal discovered mid-stream could only
        produce a truncated archive, which every extraction tool reports as corrupt rather than as
        "you may not download that".
      parameters:
        - name: path
          in: query
          required: true
          description: Repeat once per selected node.
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
      responses:
        "200":
          description: the archive
          content:
            application/zip:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/files/upload:
    post:
      summary: Upload one file into a directory
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [path, file]
              properties:
                path: { type: string, description: Target directory, empty for the root }
                file: { type: string, format: binary }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileNode" }

  /api/files/download:
    get:
      summary: Download or inline-render a file
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
        - name: inline
          in: query
          description: Ask for inline rendering. The server re-checks the type and the bytes, so a stale or hostile declaration cannot force this.
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: the file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "415":
          description: the type is never rendered inline

  /api/files/thumbnail:
    get:
      summary: A small raster preview for image files
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: a JPEG
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "415":
          description: not an image

  /api/admin/users:
    get:
      summary: List accounts, optionally filtered by status
      description: |
        Administrator only. A non-admin gets 404, not 403, so the surface is invisible
        rather than merely forbidden.

        The `status` filter is the approval queue: a deployment running the `pending` JIT
        policy creates accounts disabled, and this is how an administrator finds them.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, pending, disabled]
        - name: limit
          in: query
          required: false
          schema: { type: integer, maximum: 1000, default: 100 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUser" }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/admin/users/{id}/status:
    post:
      summary: Approve, disable or re-enable an account
      description: |
        One endpoint for all three because they are the same state change with a different
        target value; three endpoints would be three places to forget the audit row or the
        credential revocation.

        Any status other than `active` revokes the account's sessions and app passwords in
        the same transaction: a disabled account whose session still works has not been
        disabled.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, pending, disabled]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/AdminUser" }
                  changed: { type: boolean }
                  sessions_revoked: { type: integer }
                  app_passwords_revoked: { type: integer }
        "400": { description: unknown status }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/admin/groups:
    get:
      summary: List groups and the accounts in them
      description: |
        Administrator only; a non-admin gets 404, not 403, so the surface is invisible rather than
        merely forbidden.

        This exists because creation and membership were write-only: an operator could make a group
        and put somebody in it, and had no way to find out what existed. Group ACLs are only usable
        if the group can be discovered in the first place.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/Group" }
        "404": { $ref: "#/components/responses/NotFoundResult" }
    post:
      summary: Create a group, or return the existing one of that name
      description: |
        Idempotent by name, matching the store: group membership arrives from the IdP on every
        login, so a non-idempotent create would fail the second time a known group signed in —
        which is every sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                display_name: { type: string }
      responses:
        "201":
          description: created, or already existed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }

  /api/admin/groups/{id}/members:
    post:
      summary: Put an account into a group, or change its role
      description: |
        Named by username or id. The response is the whole group, in the same shape the listing
        uses — one concept, one shape.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                user_id: { type: string, format: uuid }
                role: { type: string, enum: [viewer, editor, manager] }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/admin/groups/{id}/members/{userID}:
    delete:
      summary: Take an account out of a group
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: userID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: removed }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/admin/users/{id}/quota:
    post:
      summary: Change one account's byte quota
      description: |
        Quotas are applied at provisioning and were otherwise unchangeable: an operator whose user
        hit the limit could edit the database or tell the user to delete files, and the second is
        not a policy.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bytes]
              properties:
                bytes: { type: integer, minimum: 0, description: Zero means unlimited. }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [id, quota, used_bytes]
                properties:
                  id: { type: string }
                  quota: { type: integer }
                  used_bytes: { type: integer }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/admin/settings:
    get:
      summary: List the runtime settings and where each value comes from
      description: |
        The limits an administrator can change without a restart. Each entry reports its effective
        value and whether that value is the configured default or an override, because "why is the
        limit 4 MiB when the file says 8" is the question this screen exists to answer.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [settings]
                properties:
                  settings:
                    type: array
                    items: { $ref: "#/components/schemas/AdminSetting" }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/admin/settings/{key}:
    put:
      summary: Override one runtime setting
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: integer }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [key, value]
                properties:
                  key: { type: string }
                  value: { type: integer }
        "400": { description: unknown key, or a value outside its allowed range }
    delete:
      summary: Remove an override, restoring the configured value
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: reset
          content:
            application/json:
              schema:
                type: object
                required: [key, configured]
                properties:
                  key: { type: string }
                  configured: { type: integer }
        "400": { description: unknown key }

  /api/acl/:
    get:
      summary: List the grants set directly on a node
      description: |
        Direct grants only: inherited permissions are already reflected in what the
        caller can do, and listing a whole ancestor chain would bury the two rows the
        owner actually set.

        Requires `manage_permissions` on the node. A caller without it gets 404, not
        403, so the endpoint cannot be used to probe which paths exist.
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  permissions: { type: string }
                  grants:
                    type: array
                    items: { $ref: "#/components/schemas/ACLGrant" }
        "404": { $ref: "#/components/responses/NotFoundResult" }
    post:
      summary: Grant a user or group access to a node
      description: |
        The subject is named the way a person knows it — a username, an email address,
        or a group name — and resolved server-side. An unknown subject is a 404 rather
        than a grant pointing at an id that does nothing.

        Re-granting the same subject replaces the previous grant: two rows for one
        (node, subject) would make the effective permission depend on read order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, subject, permissions]
              properties:
                path: { type: string }
                subject: { type: string }
                subject_kind:
                  type: string
                  enum: [user, group]
                permissions:
                  type: array
                  items: { type: string }
                inherit:
                  type: boolean
                  description: Applies to descendants. Defaults to true.
      responses:
        "201": { description: granted }
        "400": { description: unknown permission, or no permission supplied }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/acl/{id}:
    delete:
      summary: Revoke one grant
      description: |
        The grant must belong to the node named by `path`. Ids are unguessable, but they
        appear in every listing the caller can manage, and a mistake is not unguessable.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "204": { description: revoked }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/auth/breakglass:
    post:
      summary: Local administrator login
      description: |
        The credential path that works when the IdP does not. Restricted to the
        configured source networks, refused from anywhere else, and every attempt is
        audited.

        Answers 404 when `auth.allow_local_admin` is false, so a deployment that never
        enabled it does not advertise a login that cannot work.

        `content_access` is always false: this account administers and audits, and
        cannot read user files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: { type: boolean }
                  role: { type: string }
                  content_access: { type: boolean }
        "401": { description: invalid credentials }
        "403": { description: source address not permitted }
        "404": { description: local admin is not enabled }

  /api/shared:
    get:
      summary: List nodes other accounts have granted you access to
      description: |
        Every other path in this API addresses a node by a path inside the caller's
        own namespace. A resource-ACL grant can point into somebody else's tree, so
        those nodes are unreachable by path — this is the explicit second way in.

        Only the roots of granted subtrees are returned; descend with
        `/api/shared/{id}`. The `permissions` string is advisory: every action
        re-checks through the same authorizer.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SharedNode" }

  /api/shared/{id}/content:
    get:
      summary: Stream a shared file's bytes
      description: |
        The content half of `/api/shared/{id}`. A grantee's own namespace cannot name
        another account's path, so without this route a `download` grant was unusable.

        Requires the `download` permission specifically, not `read`: an ACL can grant
        metadata visibility without the right to take a copy.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: the file's bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { description: the node is a directory }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/shared/{id}:
    get:
      summary: Read one node by id, including its children
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedNode" }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/shares/:
    get:
      summary: Shares owned by the caller
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Share" } }
    post:
      summary: Create a share
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateShareRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareCreated" }

  /api/shares/{id}:
    delete:
      summary: Revoke a share
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: revoked }

  /api/audit/events:
    get:
      summary: Audit events, newest first
      parameters:
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
        - name: actions
          in: query
          schema: { type: string }
        - name: result
          in: query
          schema: { type: string }
        - name: since
          in: query
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }

  /api/apppasswords/:
    get:
      summary: App passwords for WebDAV and other clients
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AppPassword" } }
    post:
      summary: Issue an app password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, scope]
              properties:
                label: { type: string }
                scope: { type: string, enum: [rw, ro] }
      responses:
        "201":
          description: created; the plaintext appears exactly once
          content:
            application/json:
              schema:
                type: object
                required: [secret, id, prefix]
                properties:
                  secret: { type: string }
                  id: { type: string }
                  prefix: { type: string }
                  note: { type: string }

  /api/apppasswords/{id}:
    delete:
      summary: Revoke an app password
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: revoked }

  /s/{token}:
    get:
      summary: Public share landing
      description: |
        Returns the shell as HTML for a navigation and JSON for a fetch, so the same URL works
        for both. No session is required.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: the landing page, or its data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareLanding" }
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFoundResult" }

components:
  responses:
    Unauthenticated:
      description: no live session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFoundResult:
      description: |
        Absent, or present but not visible to this caller. The two are deliberately
        indistinguishable so a client cannot probe for existence.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }

    Me:
      type: object
      required: [id, username, email, role]
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        display_name: { type: string }
        role: { type: string }
        quota_bytes: { type: integer }
        used_bytes: { type: integer }
        storage:
          type: object
          properties:
            layout: { type: string }
            backend: { type: string }

    FileNode:
      type: object
      required: [id, name, path, kind, size, modified_at, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        path: { type: string }
        kind: { type: string, enum: [file, dir] }
        size: { type: integer }
        mime: { type: string }
        etag: { type: string }
        modified_at: { type: string }
        created_at: { type: string }
        trashed: { type: boolean }
        preview:
          $ref: "#/components/schemas/PreviewKind"
        share_count: { type: integer, description: Omitted when zero. }
        has_versions: { type: boolean, description: Omitted when false. }
        sha256:
          type: string
          description: |
            The file's content address, hex (core-scope §2). The blob address IS the SHA-256 of the
            bytes, so this is the same value on both storage layouts. Omitted for directories and
            when the address is unknown — "absent" and "a row of zeroes" must stay distinguishable,
            or a client verifies against a hash nobody computed.
        starred:
          type: boolean
          description: The VIEWER's own star (core-scope §4). Omitted when false.
        favorite_at:
          type: string
          description: When the viewer starred it. Only set on the favorites listing, where it is the sort key.
        tags:
          type: array
          description: Labels on this node that the viewer may see (core-scope §5). Omitted when none.
          items: { $ref: "#/components/schemas/Tag" }

    Tag:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string }
        name: { type: string }
        color:
          type: string
          description: |
            One of gray, red, orange, yellow, green, teal, blue, indigo, purple, pink. A fixed
            palette rather than a free-form value, because the colour reaches a CSS class.
        system:
          type: boolean
          description: Admin-managed shared vocabulary. Omitted for a personal tag.
        count:
          type: integer
          description: How many nodes THIS VIEWER can see carry it. Only set on the tag listing.

    CreateTagRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 64 }
        color: { type: string }
        system:
          type: boolean
          description: Administrators only. A non-admin request is refused, not downgraded.

    NodeTags:
      type: object
      required: [id, tags]
      properties:
        id: { type: string }
        tags: { type: array, items: { $ref: "#/components/schemas/Tag" } }

    Comment:
      type: object
      required: [id, node_id, author_id, body, created_at]
      properties:
        id: { type: string }
        node_id: { type: string }
        author: { type: string, description: Display name, or the username when none is set. }
        author_id: { type: string }
        parent_id: { type: string, description: Names a top-level comment. Replies are single-level. }
        body:
          type: string
          description: |
            Plain text, at most 2 000 characters, no control characters. EMPTY on a tombstone: the
            row stays so replies keep their place, but the text it is hiding is not handed out.
        created_at: { type: string }
        edited_at: { type: string, description: Set once the author has corrected the body. }
        deleted: { type: boolean, description: A tombstone. Omitted when false. }

    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 2000 }
        parent_id:
          type: string
          description: |
            A live top-level comment on the SAME node. A deeper reply, or a parent on another
            node, is refused — the data model is single-level and a cross-node parent would put a
            comment in a thread about a file the author may not be able to see.

    CommentThread:
      type: object
      required: [items, truncated, can_moderate]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Comment" } }
        truncated: { type: boolean }
        cursor: { type: string }
        can_moderate:
          type: boolean
          description: |
            Whether this caller may remove somebody else's comment on this node, so the UI can show
            the action rather than offering a button that answers 404.

    EmptyTrashResult:
      type: object
      required: [purged, nodes, bytes_freed, more]
      properties:
        purged:
          type: integer
          description: How many top-level trash entries went away, which is what the user sees disappear.
        nodes:
          type: integer
          description: How many node rows were deleted, counting every row of each subtree.
        bytes_freed:
          type: integer
          description: Storage released from the RETAINED counter, so the account is no longer told it is full.
        more:
          type: boolean
          description: |
            True when the batch bound was reached and the bin may still hold items: call again.
            False means it is empty. This is the whole contract for a client, and it is what makes
            "call me again" an answer rather than "unknown state".

    FavoriteToggle:
      type: object
      required: [id, starred]
      properties:
        id: { type: string }
        starred: { type: boolean }

    SearchResults:
      type: object
      required: [items, query, truncated, mode]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FileNode" } }
        query: { type: string }
        truncated: { type: boolean }
        cursor: { type: string, description: The page position; bound to the sort it was issued for. }
        mode:
          type: string
          enum: [name, content, all]
          description: The mode that ACTUALLY answered, which is not always the one asked for.
        degraded:
          type: boolean
          description: Set when a content mode was requested and no engine is configured.
        degraded_reason:
          type: string
          description: Human-readable explanation of the degradation.

    UploadRange:
      type: object
      required: [start, end]
      properties:
        start: { type: integer, description: First byte in the range. }
        end: { type: integer, description: First byte AFTER the range; start + length. }

    UploadSession:
      type: object
      required: [id, offset, chunk_size, ranges]
      properties:
        id: { type: string }
        offset:
          type: integer
          description: Contiguous acknowledged prefix. Every byte below this is present.
        chunk_size: { type: integer, description: The size the server suggests for each chunk. }
        ranges:
          type: array
          description: |
            Every acknowledged half-open byte interval, sorted and merged. A hole between two
            ranges is still missing even when it lies below the highest acknowledged byte.
          items: { $ref: "#/components/schemas/UploadRange" }

    UploadProgress:
      type: object
      required: [offset, ranges]
      properties:
        offset:
          type: integer
          description: Contiguous acknowledged prefix. Every byte below this is present.
        ranges:
          type: array
          description: Every acknowledged half-open byte interval, sorted and merged.
          items: { $ref: "#/components/schemas/UploadRange" }

    MoveRequest:
      type: object
      required: [from, to]
      properties:
        from: { type: string, description: Existing path inside the caller's own namespace. }
        to: { type: string, description: Destination path, including the name it should have. }

    BatchItem:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }

    BatchRequest:
      type: object
      required: [op, items]
      properties:
        op: { type: string, enum: [copy, move] }
        overwrite:
          type: boolean
          description: Replace an existing destination instead of refusing it.
        items:
          type: array
          items: { $ref: "#/components/schemas/BatchItem" }

    BatchResult:
      type: object
      required: [from, to, ok]
      properties:
        from: { type: string }
        to: { type: string }
        ok: { type: boolean }
        # target_exists is the one the client acts on: it is the signal to ask "replace it?".
        code: { type: string, description: "Machine-readable cause, e.g. target_exists or not_found." }
        error: { type: string }

    BatchResponse:
      type: object
      required: [op, results, moved, failed, complete]
      properties:
        op: { type: string }
        results:
          type: array
          items: { $ref: "#/components/schemas/BatchResult" }
        moved: { type: integer, description: Items that succeeded. }
        failed: { type: integer }
        complete: { type: boolean, description: True when every item succeeded. }

    UploadConflict:
      type: object
      required: [error, offset, ranges]
      properties:
        error: { type: string }
        message: { type: string }
        offset: { type: integer, description: Contiguous acknowledged prefix. }
        ranges:
          type: array
          description: Every acknowledged interval; anything not covered is still missing.
          items: { $ref: "#/components/schemas/UploadRange" }

    PreviewKind:
      type: string
      enum: [image, video, audio, pdf, text]

    Listing:
      type: object
      required: [path, name, children, truncated, cursor]
      properties:
        path: { type: string }
        name: { type: string }
        truncated: { type: boolean }
        # Empty string means this is the last page. It is the sort key of the last
        # row returned, so sending it back as `cursor` cannot skip a row.
        cursor: { type: string }
        children:
          type: array
          items: { $ref: "#/components/schemas/FileNode" }

    AdminUser:
      type: object
      required: [id, username, role, status]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [admin, user, guest] }
        status: { type: string, enum: [active, pending, disabled] }
        quota_bytes: { type: integer }
        used_bytes: { type: integer }
        # Exposed because it changes what the account can do: break-glass bypasses the IdP,
        # and an operator auditing the account list should be able to see it.
        is_breakglass: { type: boolean }
        created_at: { type: string }

    Group:
      type: object
      required: [id, name, members]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        display_name: { type: string }
        members:
          type: array
          items: { $ref: "#/components/schemas/GroupMember" }

    GroupMember:
      type: object
      required: [id, username, role]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        # Stored for display; authorization uses the ACL grants, not this field.
        role: { type: string }

    AdminSetting:
      type: object
      required: [key, value, configured, source]
      properties:
        key: { type: string }
        # Every runtime setting is a byte or count limit, so the value is always an integer.
        value: { type: integer }
        configured: { type: integer, description: The value from the configuration file. }
        source:
          type: string
          enum: [config, override]
          description: Whether the effective value is the default or an administrative override.

    ACLGrant:
      type: object
      required: [id, subject_kind, subject, permissions, inherit, created_at]
      properties:
        id: { type: string, format: uuid }
        subject_kind:
          type: string
          enum: [user, group]
        subject: { type: string }
        display: { type: string }
        # The stored vocabulary, e.g. ["read", "list"]. "write" is stored as itself
        # and expanded by the authorizer, so the row reads back as it was written.
        permissions:
          type: array
          items: { type: string }
        inherit: { type: boolean }
        created_at: { type: string }

    SharedNode:
      type: object
      required: [id, name, kind, permissions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [file, dir] }
        size: { type: integer }
        mime: { type: string }
        modified_at: { type: string }
        owner_id: { type: string, format: uuid }
        # The resolved permission names, e.g. "read+list+download". Advisory: the
        # server re-checks every action, so a stale value cannot grant anything.
        permissions: { type: string }
        children:
          type: array
          nullable: true
          items:
            type: object
            required: [id, name, kind]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              kind: { type: string }
              size: { type: integer }

    Version:
      type: object
      required: [version, size, created_at]
      properties:
        version: { type: integer }
        size: { type: integer }
        created_at: { type: string }

    VersionsResponse:
      type: object
      required: [path, versions, cheap_versions, version_content_available]
      properties:
        path: { type: string }
        # Whether keeping a version is cheap (differences) or expensive (a copy) — a cost signal.
        cheap_versions: { type: boolean }
        # Whether the rows below can be RESTORED. The tree layout records version rows but retains no
        # content for them, so the list is a history of changes and the Restore action would fail
        # with 409 every time. The UI must hide the action when this is false (fourth review, 6.1).
        version_content_available: { type: boolean }
        versions:
          type: array
          items: { $ref: "#/components/schemas/Version" }

    ShareKind:
      type: string
      enum: [link, email, request]

    # The body of POST /api/shares/.
    #
    # Named rather than inline so the client's dialog is typed against the same shape the handler
    # decodes. An inline object in a path is just as generated, but it cannot be named at a call
    # site, and the create dialog grew a hand-written copy of it once already — which is how the
    # email-recipient fields came to be accepted by the server and untypeable in the client.
    CreateShareRequest:
      type: object
      required: [path, kind]
      properties:
        path: { type: string }
        kind: { $ref: "#/components/schemas/ShareKind" }
        label: { type: string }
        password: { type: string }
        expires_in_seconds: { type: integer }
        max_downloads: { type: integer }
        max_uploads: { type: integer }
        # Per-share upload limits. They are enforced on the upload path, so a drop box
        # that cannot set them cannot be limited at all.
        max_bytes_per_file: { type: integer }
        max_total_bytes: { type: integer }
        retention_seconds: { type: integer }
        max_upload_rate: { type: integer }
        upload_rate_window_seconds: { type: integer }
        allowed_mime:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        # kind "email" restricts access to these addresses: one of them must prove ownership with
        # a mailed code before the link opens. An email share with no recipients fails closed — the
        # server treats the kind alone as the requirement — so the dialog must collect at least one.
        recipients:
          type: array
          items: { type: string }
        # Accepted but not trusted: the server forces it on for request shares.
        hide_contents: { type: boolean }
        # Share a node the caller did not address by path inside their OWN namespace — the way a
        # grantee exercises a `share` grant on somebody else's file.
        node_id: { type: string, format: uuid }

    Share:
      type: object
      required: [id, node_id, kind, label, node_path, has_password, download_count, upload_count, permissions, hide_contents, created_at]
      properties:
        id: { type: string }
        node_id: { type: string }
        kind: { $ref: "#/components/schemas/ShareKind" }
        label: { type: string }
        url: { type: string }
        node_path: { type: string }
        has_password: { type: boolean }
        expires_at: { type: string }
        max_downloads: { type: integer }
        download_count: { type: integer }
        max_uploads: { type: integer }
        upload_count: { type: integer }
        permissions: { type: array, items: { type: string } }
        hide_contents: { type: boolean }
        recipients: { type: array, items: { type: string } }
        created_at: { type: string }
        revoked_at: { type: string }

    ShareCreated:
      type: object
      required: [share, token, note]
      properties:
        share: { $ref: "#/components/schemas/Share" }
        token: { type: string, description: The plaintext token, returned exactly once. }
        note: { type: string }

    AuditEvent:
      type: object
      required: [id, ts, actor_kind, action, target_kind, result]
      properties:
        id: { type: integer }
        ts: { type: string }
        actor_kind: { type: string }
        actor_user_id: { type: string }
        actor_email: { type: string }
        actor_ip: { type: string }
        user_agent: { type: string }
        action: { type: string }
        target_kind: { type: string }
        target_id: { type: string }
        share_id: { type: string }
        result: { type: string }
        bytes: { type: integer }
        metadata:
          type: object
          additionalProperties: true

    AuditPage:
      type: object
      required: [events, total, offset, page_size, has_more, actions]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        total: { type: integer }
        offset: { type: integer }
        page_size: { type: integer }
        has_more: { type: boolean }
        actions:
          type: array
          items: { type: string }

    AppPassword:
      type: object
      required: [id, label, prefix, scope, created_at, revoked]
      properties:
        id: { type: string }
        label: { type: string }
        prefix: { type: string }
        scope: { type: string }
        created_at: { type: string }
        expires_at: { type: string }
        last_used: { type: string }
        revoked: { type: boolean }

    ShareLanding:
      # This payload has several shapes by design: the access gate answers with what is still
      # missing, a drop box answers with its rules and no listing, and an opened link answers with
      # the node. Nothing is `required` beyond `kind`, because a client that insists on a field the
      # gate does not send yet would have to invent it.
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/ShareKind" }
        label: { type: string }
        can_read: { type: boolean }
        requires_password: { type: boolean }
        requires_email: { type: boolean }
        expires_at: { type: string }
        # root_kind says whether the shared node is the file itself or a directory of files.
        #
        # It is what tells the landing page which primary action is honest: a directory has no
        # bytes of its own, so `GET /s/{token}/download` answers 400 is_directory for it. The page
        # rendered a Download button for both until this field existed, and for a shared folder
        # that button was guaranteed to fail.
        root_name: { type: string }
        root_kind: { type: string, enum: [file, dir] }
        hide_contents: { type: boolean }
        can_upload: { type: boolean }
        max_uploads: { type: integer }
        upload_count: { type: integer }
        # A drop box's rules, shown to the recipient before they upload rather than after a refusal.
        max_bytes_per_file: { type: integer }
        allowed_mime:
          type: array
          items: { type: string }
        # Direct children of a shared directory. Each entry is downloadable by name:
        # `GET /s/{token}/download?name=<name>`.
        children:
          type: array
          items: { $ref: "#/components/schemas/FileNode" }
