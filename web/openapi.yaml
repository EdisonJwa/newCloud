openapi: 3.1.0
info:
  title: newCloud
  version: "1"
  description: |
    The REST surface the browser client uses.

    This document is the single source of truth for the client's types: `src/api-types.ts` is
    generated from it and `src/types.ts` only aliases the generated names. Hand-writing the
    types beside a hand-written client is how a client drifts from its server without anyone
    noticing — the compiler keeps agreeing with the wrong shape.

    Denials are reported as 404, never 403: the server does not reveal whether an object
    exists to a caller who may not see it. Clients must not special-case 403.

servers:
  - url: ""

paths:
  /api/auth/me:
    get:
      summary: The signed-in user
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/auth/logout:
    post:
      summary: End the session
      responses:
        "204": { description: ended }

  /api/files/:
    get:
      summary: List one directory
      description: |
        Pages are addressed by a cursor, not an offset. An offset over a name sort
        returns duplicates and drops rows whenever a sibling is created or deleted
        between requests; the cursor is the last name of the previous page, so the
        next page starts strictly after it and stays correct under concurrent edits.
      parameters:
        - name: path
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          description: The `cursor` from the previous page. Omit for the first page.
          schema: { type: string }
        - name: limit
          in: query
          description: Page size, clamped by the server's configured maximum.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "404": { $ref: "#/components/responses/NotFoundResult" }
    delete:
      summary: Move a file or directory to the trash
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "204": { description: trashed }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/files/uploads:
    post:
      summary: Start a resumable upload
      description: |
        Returns a session id and the offset the server is at. Chunks are appended with
        Content-Range, and the response to a conflicting chunk carries the true offset so the
        client resumes rather than restarts.

        Sessions live in memory: an upload survives a dropped connection, not a server restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, name, size]
              properties:
                path: { type: string, description: Target directory, empty for the root }
                name: { type: string }
                size: { type: integer, minimum: 0 }
      responses:
        "201":
          description: session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSession" }
        "413": { description: the declared size exceeds the configured limit }
        "429": { description: too many unfinished uploads for this account }

  /api/files/uploads/{id}:
    put:
      summary: Append one chunk
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: Content-Range
          in: header
          required: true
          description: 'bytes <start>-<end>/<total>'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: chunk accepted
          content:
            application/json:
              schema:
                type: object
                required: [offset]
                properties:
                  offset: { type: integer }
        "409":
          description: the chunk did not start at the server's offset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadConflict" }
    delete:
      summary: Abort an upload and discard its staged bytes
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: discarded }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/files/uploads/{id}/complete:
    post:
      summary: Publish a completed upload
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: the file now exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileNode" }
        "409":
          description: the upload is not complete yet; the offset says where the server is
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadConflict" }

  /api/files/recent:
    get:
      summary: Recently modified files, newest first
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 60, default: 12 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FileNode" } }

  /api/files/search:
    get:
      summary: Name search across the tree
      description: |
        Matches node names only, not contents. Queries shorter than two characters return
        nothing rather than the whole library.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items, query]
                properties:
                  query: { type: string }
                  items: { type: array, items: { $ref: "#/components/schemas/FileNode" } }
  /api/files/trash:
    get:
      summary: Trashed nodes
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FileNode" } }

  /api/files/versions:
    get:
      summary: Stored versions of one file
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionsResponse" }

  /api/files/restore-version:
    post:
      summary: Make an older version current
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, version]
              properties:
                path: { type: string }
                version: { type: integer }
      responses:
        "204": { description: restored }

  /api/files/restore:
    post:
      summary: Restore from the trash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
      responses:
        "204": { description: restored }

  /api/files/mkdir:
    post:
      summary: Create a directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
      responses:
        "201": { description: created }

  /api/files/rename:
    post:
      summary: Rename in place
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, name]
              properties:
                path: { type: string }
                name: { type: string }
      responses:
        "204": { description: renamed }

  /api/files/upload:
    post:
      summary: Upload one file into a directory
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [path, file]
              properties:
                path: { type: string, description: Target directory, empty for the root }
                file: { type: string, format: binary }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileNode" }

  /api/files/download:
    get:
      summary: Download or inline-render a file
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
        - name: inline
          in: query
          description: Ask for inline rendering. The server re-checks the type and the bytes, so a stale or hostile declaration cannot force this.
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: the file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "415":
          description: the type is never rendered inline

  /api/files/thumbnail:
    get:
      summary: A small raster preview for image files
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: a JPEG
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "415":
          description: not an image

  /api/admin/users:
    get:
      summary: List accounts, optionally filtered by status
      description: |
        Administrator only. A non-admin gets 404, not 403, so the surface is invisible
        rather than merely forbidden.

        The `status` filter is the approval queue: a deployment running the `pending` JIT
        policy creates accounts disabled, and this is how an administrator finds them.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, pending, disabled]
        - name: limit
          in: query
          required: false
          schema: { type: integer, maximum: 1000, default: 100 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUser" }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/admin/users/{id}/status:
    post:
      summary: Approve, disable or re-enable an account
      description: |
        One endpoint for all three because they are the same state change with a different
        target value; three endpoints would be three places to forget the audit row or the
        credential revocation.

        Any status other than `active` revokes the account's sessions and app passwords in
        the same transaction: a disabled account whose session still works has not been
        disabled.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, pending, disabled]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/AdminUser" }
                  changed: { type: boolean }
                  sessions_revoked: { type: integer }
                  app_passwords_revoked: { type: integer }
        "400": { description: unknown status }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/acl/:
    get:
      summary: List the grants set directly on a node
      description: |
        Direct grants only: inherited permissions are already reflected in what the
        caller can do, and listing a whole ancestor chain would bury the two rows the
        owner actually set.

        Requires `manage_permissions` on the node. A caller without it gets 404, not
        403, so the endpoint cannot be used to probe which paths exist.
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  permissions: { type: string }
                  grants:
                    type: array
                    items: { $ref: "#/components/schemas/ACLGrant" }
        "404": { $ref: "#/components/responses/NotFoundResult" }
    post:
      summary: Grant a user or group access to a node
      description: |
        The subject is named the way a person knows it — a username, an email address,
        or a group name — and resolved server-side. An unknown subject is a 404 rather
        than a grant pointing at an id that does nothing.

        Re-granting the same subject replaces the previous grant: two rows for one
        (node, subject) would make the effective permission depend on read order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, subject, permissions]
              properties:
                path: { type: string }
                subject: { type: string }
                subject_kind:
                  type: string
                  enum: [user, group]
                permissions:
                  type: array
                  items: { type: string }
                inherit:
                  type: boolean
                  description: Applies to descendants. Defaults to true.
      responses:
        "201": { description: granted }
        "400": { description: unknown permission, or no permission supplied }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/acl/{id}:
    delete:
      summary: Revoke one grant
      description: |
        The grant must belong to the node named by `path`. Ids are unguessable, but they
        appear in every listing the caller can manage, and a mistake is not unguessable.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "204": { description: revoked }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/auth/breakglass:
    post:
      summary: Local administrator login
      description: |
        The credential path that works when the IdP does not. Restricted to the
        configured source networks, refused from anywhere else, and every attempt is
        audited.

        Answers 404 when `auth.allow_local_admin` is false, so a deployment that never
        enabled it does not advertise a login that cannot work.

        `content_access` is always false: this account administers and audits, and
        cannot read user files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: { type: boolean }
                  role: { type: string }
                  content_access: { type: boolean }
        "401": { description: invalid credentials }
        "403": { description: source address not permitted }
        "404": { description: local admin is not enabled }

  /api/shared:
    get:
      summary: List nodes other accounts have granted you access to
      description: |
        Every other path in this API addresses a node by a path inside the caller's
        own namespace. A resource-ACL grant can point into somebody else's tree, so
        those nodes are unreachable by path — this is the explicit second way in.

        Only the roots of granted subtrees are returned; descend with
        `/api/shared/{id}`. The `permissions` string is advisory: every action
        re-checks through the same authorizer.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SharedNode" }

  /api/shared/{id}/content:
    get:
      summary: Stream a shared file's bytes
      description: |
        The content half of `/api/shared/{id}`. A grantee's own namespace cannot name
        another account's path, so without this route a `download` grant was unusable.

        Requires the `download` permission specifically, not `read`: an ACL can grant
        metadata visibility without the right to take a copy.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: the file's bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { description: the node is a directory }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/shared/{id}:
    get:
      summary: Read one node by id, including its children
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedNode" }
        "404": { $ref: "#/components/responses/NotFoundResult" }

  /api/shares/:
    get:
      summary: Shares owned by the caller
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Share" } }
    post:
      summary: Create a share
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, kind]
              properties:
                path: { type: string }
                kind: { $ref: "#/components/schemas/ShareKind" }
                password: { type: string }
                expires_in_seconds: { type: integer }
                max_downloads: { type: integer }
                max_uploads: { type: integer }
                # Per-share upload limits. They are enforced on the upload path, so
                # a drop box that cannot set them cannot be limited at all.
                max_bytes_per_file: { type: integer }
                allowed_mime:
                  type: array
                  items: { type: string }
                permissions:
                  type: array
                  items: { type: string }
                recipients:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareCreated" }

  /api/shares/{id}:
    delete:
      summary: Revoke a share
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: revoked }

  /api/audit/events:
    get:
      summary: Audit events, newest first
      parameters:
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
        - name: actions
          in: query
          schema: { type: string }
        - name: result
          in: query
          schema: { type: string }
        - name: since
          in: query
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }

  /api/apppasswords/:
    get:
      summary: App passwords for WebDAV and other clients
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AppPassword" } }
    post:
      summary: Issue an app password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, scope]
              properties:
                label: { type: string }
                scope: { type: string, enum: [rw, ro] }
      responses:
        "201":
          description: created; the plaintext appears exactly once
          content:
            application/json:
              schema:
                type: object
                required: [secret, id, prefix]
                properties:
                  secret: { type: string }
                  id: { type: string }
                  prefix: { type: string }
                  note: { type: string }

  /api/apppasswords/{id}:
    delete:
      summary: Revoke an app password
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: revoked }

  /s/{token}:
    get:
      summary: Public share landing
      description: |
        Returns the shell as HTML for a navigation and JSON for a fetch, so the same URL works
        for both. No session is required.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: the landing page, or its data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareLanding" }
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFoundResult" }

components:
  responses:
    Unauthenticated:
      description: no live session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFoundResult:
      description: |
        Absent, or present but not visible to this caller. The two are deliberately
        indistinguishable so a client cannot probe for existence.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }

    Me:
      type: object
      required: [id, username, email, role]
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        display_name: { type: string }
        role: { type: string }
        quota_bytes: { type: integer }
        used_bytes: { type: integer }
        storage:
          type: object
          properties:
            layout: { type: string }
            backend: { type: string }

    FileNode:
      type: object
      required: [id, name, path, kind, size, modified_at, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        path: { type: string }
        kind: { type: string, enum: [file, dir] }
        size: { type: integer }
        mime: { type: string }
        etag: { type: string }
        modified_at: { type: string }
        created_at: { type: string }
        trashed: { type: boolean }
        preview:
          $ref: "#/components/schemas/PreviewKind"
        share_count: { type: integer, description: Omitted when zero. }
        has_versions: { type: boolean, description: Omitted when false. }

    UploadSession:
      type: object
      required: [id, offset, chunk_size]
      properties:
        id: { type: string }
        offset: { type: integer }
        chunk_size: { type: integer, description: The size the server suggests for each chunk. }

    UploadConflict:
      type: object
      required: [error, offset]
      properties:
        error: { type: string }
        message: { type: string }
        offset: { type: integer, description: The offset the client must resume from. }

    PreviewKind:
      type: string
      enum: [image, video, audio, pdf, text]

    Listing:
      type: object
      required: [path, name, children, truncated, cursor]
      properties:
        path: { type: string }
        name: { type: string }
        truncated: { type: boolean }
        # Empty string means this is the last page. It is the sort key of the last
        # row returned, so sending it back as `cursor` cannot skip a row.
        cursor: { type: string }
        children:
          type: array
          items: { $ref: "#/components/schemas/FileNode" }

    AdminUser:
      type: object
      required: [id, username, role, status]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [admin, user, guest] }
        status: { type: string, enum: [active, pending, disabled] }
        quota_bytes: { type: integer }
        used_bytes: { type: integer }
        # Exposed because it changes what the account can do: break-glass bypasses the IdP,
        # and an operator auditing the account list should be able to see it.
        is_breakglass: { type: boolean }
        created_at: { type: string }

    ACLGrant:
      type: object
      required: [id, subject_kind, subject, permissions, inherit, created_at]
      properties:
        id: { type: string, format: uuid }
        subject_kind:
          type: string
          enum: [user, group]
        subject: { type: string }
        display: { type: string }
        # The stored vocabulary, e.g. ["read", "list"]. "write" is stored as itself
        # and expanded by the authorizer, so the row reads back as it was written.
        permissions:
          type: array
          items: { type: string }
        inherit: { type: boolean }
        created_at: { type: string }

    SharedNode:
      type: object
      required: [id, name, kind, permissions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [file, dir] }
        size: { type: integer }
        mime: { type: string }
        modified_at: { type: string }
        owner_id: { type: string, format: uuid }
        # The resolved permission names, e.g. "read+list+download". Advisory: the
        # server re-checks every action, so a stale value cannot grant anything.
        permissions: { type: string }
        children:
          type: array
          nullable: true
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              kind: { type: string }
              size: { type: integer }

    Version:
      type: object
      required: [version, size, created_at]
      properties:
        version: { type: integer }
        size: { type: integer }
        created_at: { type: string }

    VersionsResponse:
      type: object
      required: [path, versions, cheap_versions]
      properties:
        path: { type: string }
        cheap_versions: { type: boolean }
        versions:
          type: array
          items: { $ref: "#/components/schemas/Version" }

    ShareKind:
      type: string
      enum: [link, email, request]

    Share:
      type: object
      required: [id, node_id, kind, label, node_path, has_password, download_count, upload_count, permissions, hide_contents, created_at]
      properties:
        id: { type: string }
        node_id: { type: string }
        kind: { $ref: "#/components/schemas/ShareKind" }
        label: { type: string }
        url: { type: string }
        node_path: { type: string }
        has_password: { type: boolean }
        expires_at: { type: string }
        max_downloads: { type: integer }
        download_count: { type: integer }
        max_uploads: { type: integer }
        upload_count: { type: integer }
        permissions: { type: array, items: { type: string } }
        hide_contents: { type: boolean }
        recipients: { type: array, items: { type: string } }
        created_at: { type: string }
        revoked_at: { type: string }

    ShareCreated:
      type: object
      required: [share, token, note]
      properties:
        share: { $ref: "#/components/schemas/Share" }
        token: { type: string, description: The plaintext token, returned exactly once. }
        note: { type: string }

    AuditEvent:
      type: object
      required: [id, ts, actor_kind, action, target_kind, result]
      properties:
        id: { type: integer }
        ts: { type: string }
        actor_kind: { type: string }
        actor_user_id: { type: string }
        actor_email: { type: string }
        actor_ip: { type: string }
        user_agent: { type: string }
        action: { type: string }
        target_kind: { type: string }
        target_id: { type: string }
        share_id: { type: string }
        result: { type: string }
        bytes: { type: integer }
        metadata:
          type: object
          additionalProperties: true

    AuditPage:
      type: object
      required: [events, total, offset, page_size, has_more, actions]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        total: { type: integer }
        offset: { type: integer }
        page_size: { type: integer }
        has_more: { type: boolean }
        actions:
          type: array
          items: { type: string }

    AppPassword:
      type: object
      required: [id, label, prefix, scope, created_at, revoked]
      properties:
        id: { type: string }
        label: { type: string }
        prefix: { type: string }
        scope: { type: string }
        created_at: { type: string }
        expires_at: { type: string }
        last_used: { type: string }
        revoked: { type: boolean }

    ShareLanding:
      type: object
      required: [kind, can_read, requires_password, requires_email, upload_count]
      properties:
        kind: { $ref: "#/components/schemas/ShareKind" }
        label: { type: string }
        can_read: { type: boolean }
        requires_password: { type: boolean }
        requires_email: { type: boolean }
        expires_at: { type: string }
        max_uploads: { type: integer }
        upload_count: { type: integer }
        children:
          type: array
          items: { $ref: "#/components/schemas/FileNode" }
